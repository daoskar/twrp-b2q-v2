name: Publish verified TWRP b2q test6n

on:
  push:
    branches:
      - test6n-ueventd-spu
    paths:
      - '.github/workflows/publish-test6n.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35502836850'
      SOURCE_ARTIFACT: 'TWRP-b2q-ueventd-spu-test6n-41e5e26c3e01c81a275addcb1ef61ed7fd472981'
      SOURCE_SHA: '41e5e26c3e01c81a275addcb1ef61ed7fd472981'
      RECOVERY_SIZE: '100663296'
      TAG: 'v0.1.0-test6n'

    steps:
      - name: Wait for exact source build
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          ACTUAL_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"

      - name: Download exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "$SOURCE_ARTIFACT"             --dir dist
          test -f dist/recovery.img
          test -f dist/recovery.img.sha256

      - name: Verify recovery image
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(stat -c '%s' recovery.img)" = "$RECOVERY_SIZE"
          EXPECTED="$(awk 'NR==1 {print $1}' recovery.img.sha256)"
          test -n "$EXPECTED"
          echo "$EXPECTED  recovery.img" | sha256sum -c -
          echo "RECOVERY_SHA256=$EXPECTED" >> "$GITHUB_ENV"

      - name: Verify test6n inside final ramdisk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          img = Path("dist/recovery.img").read_bytes()
          if img[:8] != b"ANDROID!":
              raise SystemExit("not an Android boot image")

          kernel_size = struct.unpack_from("<I", img, 8)[0]
          ramdisk_size = struct.unpack_from("<I", img, 16)[0]
          page_size = struct.unpack_from("<I", img, 36)[0]
          header_version = struct.unpack_from("<I", img, 40)[0]

          if page_size <= 0:
              raise SystemExit(f"invalid page size: {page_size}")
          if header_version != 2:
              raise SystemExit(f"unexpected boot header version: {header_version}")

          align = lambda n: (n + page_size - 1) // page_size * page_size
          ramdisk_off = page_size + align(kernel_size)
          ramdisk = img[ramdisk_off:ramdisk_off + ramdisk_size]
          if len(ramdisk) != ramdisk_size:
              raise SystemExit("truncated ramdisk")

          Path("/tmp/b2q-ramdisk.bin").write_bytes(ramdisk)
          print(f"boot header v{header_version}, page={page_size}, kernel={kernel_size}, ramdisk={ramdisk_size}")
          PY

          MAGIC="$(xxd -p -l 4 /tmp/b2q-ramdisk.bin)"
          case "$MAGIC" in
            1f8b*) gzip -dc /tmp/b2q-ramdisk.bin > /tmp/b2q-ramdisk.cpio ;;
            02214c18|04224d18)
              sudo apt-get update -qq
              sudo apt-get install -y -qq lz4
              lz4 -dc /tmp/b2q-ramdisk.bin > /tmp/b2q-ramdisk.cpio
              ;;
            *) cp /tmp/b2q-ramdisk.bin /tmp/b2q-ramdisk.cpio ;;
          esac

          grep -aFq '/dev/sp_kernel            0660   system     system' /tmp/b2q-ramdisk.cpio
          grep -aFq '/dev/sp_keymaster         0660   system     system' /tmp/b2q-ramdisk.cpio
          grep -aFq '/dev/qsee_ipc_irq_spss    0660   system     drmrpc' /tmp/b2q-ramdisk.cpio
          grep -aFq 'b2q-security-diag.sh' /tmp/b2q-ramdisk.cpio
          grep -aFq 'stdio_to_kmsg' /tmp/b2q-ramdisk.cpio
          grep -aFq 'QSEECOMD STABLE' /tmp/b2q-ramdisk.cpio
          grep -aFq 'SPU STACK STABLE' /tmp/b2q-ramdisk.cpio
          grep -aFq 'SPU STACK UNSTABLE' /tmp/b2q-ramdisk.cpio
          grep -aFq 'KEYMASTER HAL WAIT' /tmp/b2q-ramdisk.cpio
          grep -aFq 'KEYMASTER HAL READY' /tmp/b2q-ramdisk.cpio
          grep -aFq 'DM DEFAULT KEY READY' /tmp/b2q-ramdisk.cpio
          grep -aFq 'F2FS MOUNT START' /tmp/b2q-ramdisk.cpio
          echo '[b2q] test6n verified in final ramdisk'

      - name: Build Odin packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          BASE="TWRP-b2q-test6n-41e5e26c"
          tar --format=ustar -cf "$BASE-Odin.tar" recovery.img
          cp "$BASE-Odin.tar" "$BASE-Odin.tar.md5"
          md5sum -t "$BASE-Odin.tar.md5" >> "$BASE-Odin.tar.md5"
          sha256sum recovery.img "$BASE-Odin.tar" "$BASE-Odin.tar.md5" > SHA256SUMS.txt
          tar -tf "$BASE-Odin.tar"

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          ## TWRP b2q v2 — test6n ueventd/SPU

          Samsung Galaxy Z Flip3 **SM-F711B / b2q**.

          Exact source commit: \`$SOURCE_SHA\`
          Exact source build: **#41**

          The test6m device result showed all security services later in
          \`restarting\`, while SPU nodes such as \`/dev/sp_kernel\` and
          \`/dev/sp_ssr\` had fallen back to \`root:root 0600\`.

          test6n:
          - adds stock SM8350 ueventd permissions for QSEE/SPU nodes so recreated
            nodes keep correct system/drmrpc ownership after SPU SSR
          - starts services in stock-like order: QSEE → SPU/NVM → Keymaster
          - uses one-shot diagnostic services with stdout/stderr routed to kmsg
          - requires QSEE and SPU to remain stable instead of accepting a transient
            \`running\` state
          - waits for \`/dev/sp_nvm\` and \`/dev/sp_keymaster\`
          - on failure prints first-crash init/linker/logcat/dmesg/AVC diagnostics
          - preserves metadata, dm-default-key and F2FS diagnostics

          Verified final image:
          - size: **100663296 bytes (96 MiB)**
          - SHA-256: \`$RECOVERY_SHA256\`

          **Testing:** boot test6n, then **Mount → Prepare Data**.
          Do not manually mount \`/data\` first and do not Format Data.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$SOURCE_SHA"             --title 'TWRP b2q v2 — test6n ueventd SPU (41e5e26c)'             --prerelease             --notes-file /tmp/release-notes.md             dist/TWRP-b2q-test6n-41e5e26c-Odin.tar.md5             dist/TWRP-b2q-test6n-41e5e26c-Odin.tar             dist/recovery.img             dist/recovery.img.sha256             dist/SHA256SUMS.txt
