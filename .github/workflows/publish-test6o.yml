name: Publish verified TWRP b2q test6o

on:
  push:
    branches:
      - test6o-publish-artifact
    paths:
      - '.github/workflows/publish-test6o.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35507805129'
      SOURCE_ARTIFACT: 'TWRP-b2q-libion-keymaster-test6o-8633783864428226a68ec3d95fda0d0fa55c4b0e'
      SOURCE_SHA: '8633783864428226a68ec3d95fda0d0fa55c4b0e'
      RECOVERY_SIZE: '100663296'
      TAG: 'v0.1.0-test6o'

    steps:
      - name: Wait for exact source build
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          ACTUAL_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"

      - name: Download exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir dist
          test -f dist/recovery.img
          test -f dist/recovery.img.sha256

      - name: Verify recovery image
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(stat -c '%s' recovery.img)" = "$RECOVERY_SIZE"
          EXPECTED="$(awk 'NR==1 {print $1}' recovery.img.sha256)"
          test -n "$EXPECTED"
          echo "$EXPECTED  recovery.img" | sha256sum -c -
          echo "RECOVERY_SHA256=$EXPECTED" >> "$GITHUB_ENV"

      - name: Verify libion and test6o inside final ramdisk
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio lz4

          python3 - <<'PY'
          from pathlib import Path
          import struct

          img = Path("dist/recovery.img").read_bytes()
          if img[:8] != b"ANDROID!":
              raise SystemExit("not an Android boot image")
          kernel_size = struct.unpack_from("<I", img, 8)[0]
          ramdisk_size = struct.unpack_from("<I", img, 16)[0]
          page_size = struct.unpack_from("<I", img, 36)[0]
          header_version = struct.unpack_from("<I", img, 40)[0]
          if page_size <= 0:
              raise SystemExit(f"invalid page size: {page_size}")
          if header_version != 2:
              raise SystemExit(f"unexpected boot header version: {header_version}")
          align = lambda n: (n + page_size - 1) // page_size * page_size
          ramdisk_off = page_size + align(kernel_size)
          ramdisk = img[ramdisk_off:ramdisk_off + ramdisk_size]
          if len(ramdisk) != ramdisk_size:
              raise SystemExit("truncated ramdisk")
          Path("/tmp/b2q-ramdisk.bin").write_bytes(ramdisk)
          print(f"boot header v{header_version}, page={page_size}, kernel={kernel_size}, ramdisk={ramdisk_size}")
          PY

          MAGIC="$(xxd -p -l 4 /tmp/b2q-ramdisk.bin)"
          case "$MAGIC" in
            1f8b*) gzip -dc /tmp/b2q-ramdisk.bin > /tmp/b2q-ramdisk.cpio ;;
            02214c18|04224d18) lz4 -dc /tmp/b2q-ramdisk.bin > /tmp/b2q-ramdisk.cpio ;;
            *) cp /tmp/b2q-ramdisk.bin /tmp/b2q-ramdisk.cpio ;;
          esac

          rm -rf /tmp/b2q-root
          mkdir -p /tmp/b2q-root
          (cd /tmp/b2q-root && cpio -idmu --quiet < /tmp/b2q-ramdisk.cpio)
          test -s /tmp/b2q-root/system/lib64/libion.so
          file /tmp/b2q-root/system/lib64/libion.so
          readelf -h /tmp/b2q-root/system/lib64/libion.so | grep -F 'Class:' | grep -F 'ELF64'
          readelf -d /tmp/b2q-root/system/lib64/libion.so | grep -F 'liblog.so'

          grep -aFq 'QSEECOMD STABLE' /tmp/b2q-ramdisk.cpio
          grep -aFq 'SPU STACK STABLE' /tmp/b2q-ramdisk.cpio
          grep -aFq 'KEYMASTER HAL WAIT' /tmp/b2q-ramdisk.cpio
          grep -aFq 'KEYMASTER HAL READY' /tmp/b2q-ramdisk.cpio
          grep -aFq 'DM DEFAULT KEY READY' /tmp/b2q-ramdisk.cpio
          grep -aFq 'F2FS MOUNT START' /tmp/b2q-ramdisk.cpio
          echo '[b2q] test6o libion + security-stack logic verified in final ramdisk'

      - name: Build Odin packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          BASE="TWRP-b2q-test6o-86337838"
          tar --format=ustar -cf "$BASE-Odin.tar" recovery.img
          cp "$BASE-Odin.tar" "$BASE-Odin.tar.md5"
          md5sum -t "$BASE-Odin.tar.md5" >> "$BASE-Odin.tar.md5"
          sha256sum recovery.img "$BASE-Odin.tar" "$BASE-Odin.tar.md5" > SHA256SUMS.txt
          tar -tf "$BASE-Odin.tar"

      - name: Upload verified Odin artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-b2q-test6o-86337838-Odin
          path: |
            dist/TWRP-b2q-test6o-86337838-Odin.tar.md5
            dist/TWRP-b2q-test6o-86337838-Odin.tar
            dist/recovery.img
            dist/recovery.img.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          ## TWRP b2q v2 — test6o libion / Keymaster

          Samsung Galaxy Z Flip3 **SM-F711B / b2q**.

          Exact source commit: \`$SOURCE_SHA\`
          Exact source build: **#45**

          test6n exposed the first concrete linker failure:
          \`library "libion.so" not found: needed by /vendor/lib64/libkeymasterdeviceutils.so\`.

          test6o:
          - builds AOSP/TWRP \`libion\` as a recovery module
          - copies/relinks \`libion.so\` into \`/system/lib64\`
          - retains stock SM8350 QSEE/SPU ueventd rules and crash diagnostics
          - retains QSEE → SPU/NVM → Keymaster ordering
          - retains metadata, dm-default-key and F2FS diagnostics

          Final publisher verifies that \`system/lib64/libion.so\` exists in the
          actual recovery ramdisk and is ELF64 before release.

          Verified final image:
          - size: **100663296 bytes (96 MiB)**
          - SHA-256: \`$RECOVERY_SHA256\`

          **Testing:** boot test6o, then **Mount → Prepare Data**.
          Do not manually mount \`/data\` first and do not Format Data.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'TWRP b2q v2 — test6o libion Keymaster (86337838)' \
            --prerelease \
            --notes-file /tmp/release-notes.md \
            dist/TWRP-b2q-test6o-86337838-Odin.tar.md5 \
            dist/TWRP-b2q-test6o-86337838-Odin.tar \
            dist/recovery.img \
            dist/recovery.img.sha256 \
            dist/SHA256SUMS.txt
