name: Probe stock F711B JZH3 APNHLOS

on:
  push:
    branches:
      - probe-jzh3-stock-apnhlos
  workflow_dispatch:

concurrency:
  group: probe-jzh3-stock-apnhlos
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe S-Update JZH3 download endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe scripts
          URL='https://s-update.samsungvn.com/devices/SM-F711B'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$URL" -o probe/supdate.html
          echo "page_size=$(stat -c %s probe/supdate.html)" | tee probe/summary.txt

          python3 - <<'PY' | tee -a probe/summary.txt
          from pathlib import Path
          import re, html as h
          s=Path('probe/supdate.html').read_text(errors='ignore')
          needle='F711BXXSJJZH3'
          poss=[m.start() for m in re.finditer(needle,s)]
          print('JZH3_OCCURRENCES=',len(poss))
          for n,i in enumerate(poss[:8]):
              chunk=s[max(0,i-5000):i+9000]
              Path(f'probe/jzh3-context-{n}.html').write_text(chunk)
              print(f'--- CONTEXT {n} OFFSET {i} ---')
              # Print compact lines around links/forms/buttons/data attrs.
              for line in chunk.splitlines():
                  low=line.lower()
                  if any(k in low for k in ['href=','action=','onclick=','download','data-','form','button','f711bxxsjjzh3']):
                      print(h.unescape(line.strip())[:3000])
          PY

          echo '--- all interesting URLs ---' | tee -a probe/summary.txt
          python3 - <<'PY' | tee -a probe/summary.txt
          from pathlib import Path
          import re, html
          s=html.unescape(Path('probe/supdate.html').read_text(errors='ignore'))
          urls=set()
          for pat in [
              r'https?://[^"\'<> ]+',
              r'href=["\']([^"\']+)["\']',
              r'action=["\']([^"\']+)["\']',
              r'(?:url|link|downloadUrl|download_url)\s*[:=]\s*["\']([^"\']+)["\']',
          ]:
              for m in re.finditer(pat,s,re.I):
                  u=m.group(1) if m.lastindex else m.group(0)
                  if any(k in u.lower() for k in ['download','firmware','update','f711','samsung','api']):
                      urls.add(u)
          for u in sorted(urls):
              print(u)
          PY

          echo '--- script src list ---' | tee -a probe/summary.txt
          python3 - <<'PY' | tee probe/script-src.txt
          from pathlib import Path
          import re, html
          s=html.unescape(Path('probe/supdate.html').read_text(errors='ignore'))
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I):
              print(m.group(1))
          PY

          while IFS= read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              //*) full="https:$src" ;;
              /*) full="https://s-update.samsungvn.com$src" ;;
              http*) full="$src" ;;
              *) full="https://s-update.samsungvn.com/$src" ;;
            esac
            fn="$(printf '%s' "$src" | tr '/?&=:.' '_' | cut -c1-160)"
            curl -fsSL --retry 2 -A 'Mozilla/5.0' "$full" -o "scripts/$fn" || true
          done < probe/script-src.txt

          echo '--- JS download/api references ---' | tee -a probe/summary.txt
          grep -RniE 'download|firmware|fuddy|api/|ajax|fetch\(|axios|location\.href|window\.open|s-update' scripts             | head -n 600 | tee probe/js-download-refs.txt || true

          echo '--- forms/buttons globally ---' | tee -a probe/summary.txt
          grep -niE '<form|<button|download|onclick=|data-url=|data-link=|data-id=' probe/supdate.html             | head -n 500 | tee probe/forms-buttons.txt || true

      - name: Upload S-Update endpoint probe
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F711B-JZH3-SUpdate-endpoint-probe
          path: |
            probe/
            scripts/
          if-no-files-found: warn
          retention-days: 7
