name: Probe stock F711B JZH3 APNHLOS

on:
  push:
    branches:
      - probe-jzh3-stock-apnhlos
  workflow_dispatch:

concurrency:
  group: probe-jzh3-stock-apnhlos
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install current SamLoader Reloaded
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user git+https://github.com/t0rzz/SamLoader-Reloaded.git
          python3 -m samloader --help | head -n 80

      - name: Probe official JZH3 FUS metadata and encrypted range
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee fus-probe.txt
          from Cryptodome.Cipher import AES
          from samloader import fusclient, main, imei, crypt

          MODEL='SM-F711B'
          REGION='PLS'
          FW='F711BXXSJJZH3/F711BOXMJJZH3/F711BXXSJJZH3/F711BXXSJJZH3'

          class Args:
              command='download'
              dev_model=MODEL
              dev_region=REGION
              dev_imei=None

          a=Args()
          if imei.fixup_imei(a):
              raise SystemExit('IMEI generation failed')

          client=fusclient.FUSClient()
          path, filename, size=main.getbinaryfile(client, FW, MODEL, a.dev_imei, REGION)
          print('MODEL=', MODEL)
          print('REGION=', REGION)
          print('FW=', FW)
          print('FUS_PATH=', path)
          print('FUS_FILENAME=', filename)
          print('FUS_SIZE=', size)

          key=crypt.getv4key(FW, MODEL, REGION, a.dev_imei)
          if not key:
              raise SystemExit('V4 key retrieval failed')
          print('V4_KEY_OK=1')

          main.initdownload(client, filename)
          r=client.downloadfile(path+filename, 0, 31)
          data=r.content
          print('RANGE_STATUS=', r.status_code)
          print('RANGE_LEN=', len(data))
          print('CONTENT_RANGE=', r.headers.get('Content-Range'))
          dec=AES.new(key, AES.MODE_ECB).decrypt(data[:16])
          print('DEC_HEAD_HEX=', dec.hex())
          print('DEC_HEAD_MAGIC=', repr(dec[:4]))
          if not dec.startswith(b'PK\x03\x04'):
              raise SystemExit('Decrypted firmware does not start with ZIP local header')
          print('OFFICIAL_FUS_RANGE_OK=1')
          PY

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: F711B-JZH3-FUS-probe
          path: fus-probe.txt
          if-no-files-found: error
          retention-days: 7
