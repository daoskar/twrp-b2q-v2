name: Probe stock F711B JZH3 APNHLOS

on:
  push:
    branches:
      - probe-jzh3-stock-apnhlos
  workflow_dispatch:

concurrency:
  group: probe-jzh3-stock-apnhlos
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install probe deps
        run: python3 -m pip install --user pycryptodomex requests

      - name: Probe corrected Samsung FUS auth
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://gist.githubusercontent.com/ungeskriptet/a4fa425ffb554a9ca72b2eafca64dcd7/raw/samfirm.py' -o /tmp/samfirm_ref.py
          python3 - <<'PY' | tee fus-corrected-protocol.txt
          import ast, base64, hashlib, requests, xml.etree.ElementTree as ET
          from Cryptodome.Cipher import AES
          from Cryptodome.Util.Padding import pad, unpad

          # Load only the public reference helper functions, without executing its CLI.
          src=open('/tmp/samfirm_ref.py','r',encoding='utf-8').read()
          tree=ast.parse(src)
          wanted={'decryptnonce','logiccheck'}
          body=[n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.Import,ast.ImportFrom)) and (not isinstance(n,ast.FunctionDef) or n.name in wanted)]
          ns={}
          exec(compile(ast.Module(body=body,type_ignores=[]),'<fus-ref>','exec'),ns,ns)
          decryptnonce=ns['decryptnonce']
          logiccheck=ns['logiccheck']

          MODEL='SM-F711B'
          REGION='PLS'
          IMEI='356392271234560'
          PDA='F711BXXSJJZH3'
          CSC='F711BOXMJJZH3'
          PHONE='F711BXXSJJZH3'
          VERSION=f'{PDA}/{CSC}/{PHONE}/{PDA}'
          BASE='https://neofussvr.sslcs.cdngc.net'
          CLOUD='http://cloud-neofussvr.samsungmobile.com/NF_DownloadBinaryForMass.do'

          def get_data(root,tag):
              el=root.find(f'./FUSBody/Put/{tag}/Data')
              if el is None or not (el.text or '').strip():
                  raise RuntimeError('missing '+tag)
              return el.text.strip()

          s=requests.Session()
          nr=s.post(BASE+'/NF_DownloadGenerateNonce.do',headers={
              'Authorization':'FUS nonce="", signature="", nc="", type="", realm="", newauth="1"',
              'User-Agent':'Kies2.0_FUS','Accept':'application/xml'
          },timeout=30)
          nr.raise_for_status()
          enc_nonce=nr.headers['NONCE']
          dec_nonce,signature=decryptnonce(enc_nonce)
          print('NONCE_OK=1 len=',len(dec_nonce))

          xml=f'''<FUSMsg><FUSHdr><ProtoVer>1.0</ProtoVer></FUSHdr><FUSBody><Put>
          <ACCESS_MODE><Data>2</Data></ACCESS_MODE><BINARY_NATURE><Data>1</Data></BINARY_NATURE>
          <CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT><CLIENT_VERSION><Data>4.3.23123_1</Data></CLIENT_VERSION>
          <DEVICE_FW_VERSION><Data>{VERSION}</Data></DEVICE_FW_VERSION><DEVICE_LOCAL_CODE><Data>{REGION}</Data></DEVICE_LOCAL_CODE>
          <DEVICE_MODEL_NAME><Data>{MODEL}</Data></DEVICE_MODEL_NAME><DEVICE_IMEI_PUSH><Data>{IMEI}</Data></DEVICE_IMEI_PUSH>
          <LOGIC_CHECK><Data>{logiccheck(VERSION,dec_nonce)}</Data></LOGIC_CHECK>
          </Put></FUSBody></FUSMsg>'''
          headers={
              'User-Agent':'Kies2.0_FUS',
              'Authorization':f'FUS nonce="{enc_nonce}", signature="{signature}", nc="", type="", realm="", newauth="1"',
              'Accept':'application/xml','Content-Type':'application/xml'
          }
          ir=s.post(BASE+'/NF_DownloadBinaryInform.do',data=xml.encode(),headers=headers,timeout=30)
          print('INFORM_HTTP=',ir.status_code)
          print('INFORM_HEAD=',repr(ir.text[:500]))
          ir.raise_for_status()
          root=ET.fromstring(ir.text)
          status=(root.findtext('./FUSBody/Results/Status') or '').strip()
          print('INFORM_STATUS=',status)
          if status!='200': raise RuntimeError('BinaryInform status '+status)

          binary=get_data(root,'BINARY_NAME')
          model_path=get_data(root,'MODEL_PATH')
          logic_value=get_data(root,'LOGIC_VALUE_FACTORY')
          size=get_data(root,'BINARY_BYTE_SIZE')
          print('BINARY_NAME=',binary)
          print('MODEL_PATH=',model_path)
          print('BINARY_SIZE=',size)
          key=hashlib.md5(logiccheck(VERSION,logic_value).encode()).digest()

          enc_nonce=ir.headers['NONCE']
          dec_nonce,signature=decryptnonce(enc_nonce)
          filename_logic=binary.split('.')[0][-16:]
          initxml=f'''<FUSMsg><FUSHdr><ProtoVer>1.0</ProtoVer></FUSHdr><FUSBody><Put>
          <BINARY_FILE_NAME><Data>{binary}</Data></BINARY_FILE_NAME>
          <LOGIC_CHECK><Data>{logiccheck(filename_logic,dec_nonce)}</Data></LOGIC_CHECK>
          </Put></FUSBody></FUSMsg>'''
          headers['Authorization']=f'FUS nonce="{enc_nonce}", signature="{signature}", nc="", type="", realm="", newauth="1"'
          br=s.post(BASE+'/NF_DownloadBinaryInitForMass.do',data=initxml.encode(),headers=headers,timeout=30)
          print('INIT_HTTP=',br.status_code)
          print('INIT_HEAD=',repr(br.text[:300]))
          br.raise_for_status()

          enc_nonce=br.headers['NONCE']
          dec_nonce,signature=decryptnonce(enc_nonce)
          dh={
              'User-Agent':'Kies2.0_FUS',
              'Authorization':f'FUS nonce="{enc_nonce}", signature="{signature}", nc="", type="", realm="", newauth="1"',
              'Accept':'application/xml','Content-Type':'application/xml',
              'Range':'bytes=0-31','Accept-Encoding':'identity'
          }
          dr=s.get(CLOUD,params={'file':model_path+binary},headers=dh,timeout=60)
          print('RANGE_HTTP=',dr.status_code)
          print('CONTENT_RANGE=',dr.headers.get('Content-Range'))
          print('RANGE_LEN=',len(dr.content))
          dr.raise_for_status()
          dec=AES.new(key,AES.MODE_ECB).decrypt(dr.content[:16])
          print('DEC_MAGIC=',repr(dec[:4]))
          if not dec.startswith(b'PK\\x03\\x04'):
              raise RuntimeError('decrypted range is not ZIP')
          print('OFFICIAL_JZH3_FUS_OK=1')
          PY

      - name: Upload corrected protocol probe
        uses: actions/upload-artifact@v4
        with:
          name: F711B-JZH3-corrected-FUS-probe
          path: fus-corrected-protocol.txt
          if-no-files-found: error
          retention-days: 7
