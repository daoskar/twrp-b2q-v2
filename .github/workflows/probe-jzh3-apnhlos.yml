name: Probe stock F711B JZH3 APNHLOS

on:
  push:
    branches:
      - probe-jzh3-stock-apnhlos
  workflow_dispatch:

concurrency:
  group: probe-jzh3-stock-apnhlos
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full unzip lz4 file dosfstools mtools python3-pip
          python3 -m pip install --break-system-packages git+https://github.com/samloader/samloader.git
          samloader --help | head -n 80

      - name: Inspect SamFW JZH3 page and child-download API
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://samfw.com/firmware/SM-F711B/PLS/F711BXXSJJZH3'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o samfw.html
          echo "page_size=$(stat -c %s samfw.html)"
          grep -n -F 'BL_F711BXXSJJZH3_F711BXXSJJZH3_MQB113546584_REV00_user_low_ship_MULTI_CERT.tar.md5.zip' samfw.html | head -n 20 || true
          echo '--- URLs / download-ish fragments ---'
          grep -Eo 'https?://[^"''' <>]+' samfw.html | grep -Ei 'download|firmware|samfw|google|drive' | sort -u | head -n 200 || true
          echo '--- nearby child firmware markup ---'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('samfw.html').read_text(errors='ignore')
          needle='BL_F711BXXSJJZH3_F711BXXSJJZH3_MQB113546584_REV00_user_low_ship_MULTI_CERT.tar.md5.zip'
          i=s.find(needle)
          print('needle_offset=',i)
          if i>=0:
              print(s[max(0,i-8000):i+12000])
          PY
          echo '--- script src ---'
          grep -Eo '<script[^>]+src=["'''][^"''']+' samfw.html | sed -E 's/.*src=["''']//' | sort -u | tee script-src.txt
          mkdir -p scripts
          while read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              //*) url="https:$src" ;;
              /*) url="https://samfw.com$src" ;;
              http*) url="$src" ;;
              *) url="https://samfw.com/$src" ;;
            esac
            fn="$(echo "$src" | tr '/?&=:.' '_' | tail -c 180)"
            curl -fsSL --retry 2 -A 'Mozilla/5.0' "$url" -o "scripts/$fn" || true
          done < script-src.txt
          echo '--- JS API/download references ---'
          grep -RniE 'download|child|firmware|bifrost|ajax|api/' scripts | head -n 600 || true

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: F711B-JZH3-APNHLOS-probe
          path: |
            samfw.html
            script-src.txt
            scripts/
          if-no-files-found: warn
          retention-days: 7
