name: Probe stock F711B JZH3 APNHLOS

on:
  push:
    branches:
      - probe-jzh3-stock-apnhlos
  workflow_dispatch:

concurrency:
  group: probe-jzh3-stock-apnhlos
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install probe deps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pycryptodomex requests

      - name: Inspect current Samsung FUS nonce format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee fus-nonce-probe.txt
          import base64, requests
          from Cryptodome.Cipher import AES

          URL='https://neofussvr.sslcs.cdngc.net/NF_DownloadGenerateNonce.do'
          KEY_1=b'vicopx7dqu06emacgpnpy8j8zwhduwlh'
          auth='FUS nonce="", signature="", nc="", type="", realm="", newauth="1"'

          for ua in ('Kies2.0_FUS','Kiss2.0_FUS'):
              print('=== UA', ua, '===')
              r=requests.post(URL, headers={'Authorization':auth,'User-Agent':ua}, timeout=15)
              print('status=',r.status_code)
              print('body_len=',len(r.content))
              print('body_head=',repr(r.text[:300]))
              enc=r.headers.get('NONCE') or r.headers.get('nonce')
              print('nonce_header_present=',bool(enc))
              if not enc:
                  print('headers=',{k:v for k,v in r.headers.items() if k.lower() in ('nonce','set-cookie','content-type','server')})
                  continue
              print('enc_nonce_len=',len(enc))
              print('enc_nonce=',enc)
              try:
                  raw=base64.b64decode(enc, validate=True)
              except Exception as e:
                  print('base64_error=',repr(e)); continue
              print('cipher_len=',len(raw))
              print('cipher_hex=',raw.hex())
              if len(raw)%16:
                  print('cipher_not_block_aligned=1'); continue
              dec=AES.new(KEY_1,AES.MODE_CBC,KEY_1[:16]).decrypt(raw)
              print('plain_padded_len=',len(dec))
              print('plain_padded_hex=',dec.hex())
              print('plain_padded_repr=',repr(dec))
              pad=dec[-1] if dec else 0
              print('pad_byte=',pad)
              valid=bool(dec) and 1 <= pad <= 16 and dec[-pad:]==bytes([pad])*pad
              print('pkcs7_valid=',int(valid))
              unpadded=dec[:-pad] if valid else dec
              print('plain_len=',len(unpadded))
              print('plain_repr=',repr(unpadded))
              try: print('plain_ascii=',unpadded.decode())
              except Exception as e: print('plain_decode_error=',repr(e))
          PY

      - name: Upload nonce probe
        uses: actions/upload-artifact@v4
        with:
          name: F711B-JZH3-FUS-nonce-probe
          path: fus-nonce-probe.txt
          if-no-files-found: error
          retention-days: 7
