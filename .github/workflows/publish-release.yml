name: Publish verified TWRP b2q release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35141637623'
      SOURCE_ARTIFACT: 'TWRP-b2q-v2-83a37fc117681f2bb9d7bc771b6f04a1a141ba8c'
      SOURCE_SHA: '83a37fc117681f2bb9d7bc771b6f04a1a141ba8c'
      TAG: 'v0.1.0-test1'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir dist
          test -f dist/recovery.img

      - name: Verify recovery image
        run: |
          set -euo pipefail
          cd dist
          test "$(stat -c '%s' recovery.img)" = '100663296'
          echo 'fb07f80a6533e9931908211f072505e75eff6bd30f9e54f747236198a30d57fc  recovery.img' | sha256sum -c -

      - name: Build Odin packages
        run: |
          set -euo pipefail
          cd dist
          tar --format=ustar -cf TWRP-b2q-v2-83a37fc-Odin.tar recovery.img
          cp TWRP-b2q-v2-83a37fc-Odin.tar TWRP-b2q-v2-83a37fc-Odin.tar.md5
          md5sum -t TWRP-b2q-v2-83a37fc-Odin.tar.md5 >> TWRP-b2q-v2-83a37fc-Odin.tar.md5
          sha256sum recovery.img TWRP-b2q-v2-83a37fc-Odin.tar TWRP-b2q-v2-83a37fc-Odin.tar.md5 > SHA256SUMS.txt
          tar -tf TWRP-b2q-v2-83a37fc-Odin.tar

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## TWRP b2q v2 — experimental test build

          Samsung Galaxy Z Flip3 **SM-F711B / b2q**.

          Built from commit `83a37fc117681f2bb9d7bc771b6f04a1a141ba8c` after a successful full TWRP 12.1 build and image verification.

          Main changes:
          - FBE + metadata decryption wiring for `/data`
          - installed-ROM OS/SPL sync before Keymaster
          - stock vendor qseecomd / Keymaster / Gatekeeper startup
          - automatic `/vendor` remount for crypto HAL startup
          - dynamic USB-OTG block-device handling
          - new minadbd path for sideload

          Files:
          - `TWRP-b2q-v2-83a37fc-Odin.tar.md5` — recommended Odin package
          - `TWRP-b2q-v2-83a37fc-Odin.tar` — plain Odin TAR
          - `recovery.img` — raw recovery image
          - `SHA256SUMS.txt` — checksums

          This is an experimental device build. Test recovery boot, `/data` decryption/PIN, USB-OTG and sideload before treating it as stable.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'TWRP b2q v2 — test1 (83a37fc)' \
            --notes-file /tmp/release-notes.md \
            dist/TWRP-b2q-v2-83a37fc-Odin.tar.md5 \
            dist/TWRP-b2q-v2-83a37fc-Odin.tar \
            dist/recovery.img \
            dist/SHA256SUMS.txt
