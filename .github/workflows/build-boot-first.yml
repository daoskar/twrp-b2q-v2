name: Build TWRP b2q no-crypto diagnostic

on:
  push:
    branches: [ test4-no-crypto ]
    paths:
      - 'BoardConfig.mk'
      - 'device.mk'
      - 'recovery/**'
      - 'scripts/**'
      - '.github/workflows/build-boot-first.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop openjdk-11-jdk pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP 12.1 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          "$HOME/bin/repo" init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          "$HOME/bin/repo" sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Checkout test4 device tree
        uses: actions/checkout@v4
        with:
          ref: test4-no-crypto
          path: twrp/device/samsung/b2q

      - name: Prepare and verify no-crypto diagnostic mode
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/twrp/device/samsung/b2q"
          bash scripts/prepare-tree.sh
          ! grep -Eq '^[[:space:]]*TW_INCLUDE_CRYPTO[[:space:]]*:=' BoardConfig.mk
          ! grep -Eq '^[[:space:]]*TW_INCLUDE_CRYPTO_FBE[[:space:]]*:=' BoardConfig.mk
          ! grep -Eq '^[[:space:]]*TW_INCLUDE_FBE_METADATA_DECRYPT[[:space:]]*:=' BoardConfig.mk
          ! grep -Eq '^[[:space:]]*BOARD_USES_QCOM_FBE_DECRYPTION[[:space:]]*:=' BoardConfig.mk
          ! grep -Fq 'qcom_decrypt_fbe' device.mk
          ! grep -Fq 'qcom_decrypt \' device.mk
          ! grep -Fq 'import /init.recovery.qcom_decrypt.rc' recovery/root/init.recovery.qcom.rc
          ! grep -Fq 'fileencryption=' recovery/root/system/etc/recovery.fstab
          ! grep -Fq 'metadata_encryption=' recovery/root/system/etc/recovery.fstab
          ! grep -Fq 'keydirectory=' recovery/root/system/etc/recovery.fstab
          bash -n scripts/prepare-tree.sh scripts/fetch-prebuilts.sh scripts/collect-device-debug.sh
          sh -n recovery/root/system/bin/twrp-otg-watch.sh
          echo '[b2q] no-crypto diagnostic assertions passed'

      - name: Build recovery.img
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          source build/envsetup.sh
          lunch twrp_b2q-eng
          mka -j"$(nproc)" recoveryimage

      - name: Verify recovery image
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/twrp/out/target/product/b2q"
          test -s "$OUT/recovery.img"
          stat "$OUT/recovery.img"
          sha256sum "$OUT/recovery.img" | tee "$OUT/recovery.img.sha256"
          if [ "$(stat -c %s "$OUT/recovery.img")" -gt 100663296 ]; then
            echo 'recovery.img exceeds the 96 MiB recovery partition' >&2
            exit 1
          fi

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-b2q-test4-no-crypto-${{ github.sha }}
          path: |
            twrp/out/target/product/b2q/recovery.img
            twrp/out/target/product/b2q/recovery.img.sha256
          if-no-files-found: error
          retention-days: 14
