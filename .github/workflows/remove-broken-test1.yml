name: Remove broken test1 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/remove-broken-test1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-test1
    steps:
      - name: Delete broken release and tag
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag

      - name: Verify release is gone
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG still exists" >&2
            exit 1
          fi
          echo "Release $TAG removed"
