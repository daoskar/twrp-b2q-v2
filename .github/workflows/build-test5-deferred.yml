name: Build TWRP b2q stock Keymaster test6ap

on:
  push:
    branches:
      - test6ap-stock-b2q-keymaster
  workflow_dispatch:

concurrency:
  group: twrp-b2q-test6ap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop openjdk-11-jdk pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP 12.1 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          "$HOME/bin/repo" init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          "$HOME/bin/repo" sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Checkout test6ap device tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: twrp/device/samsung/b2q

      - name: Prepare stable baseline and manual metadata action
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$GITHUB_WORKSPACE/twrp/device/samsung/b2q"
          RECOVERY="$GITHUB_WORKSPACE/twrp/bootable/recovery"
          VOLD="$GITHUB_WORKSPACE/twrp/system/vold"
          cd "$DEVICE"
          bash scripts/prepare-tree.sh

          # test6v: build the Samsung Keymaster wrapper used by SM8350 Lineage.
          # Pin both open-source wrapper and proprietary device library to exact commits.
          SAMSUNG_KM="$GITHUB_WORKSPACE/twrp/hardware/samsung/hidl/keymaster"
          mkdir -p "$SAMSUNG_KM"
          KM_SRC_BASE="https://raw.githubusercontent.com/LineageOS/android_hardware_samsung/340c2b58099de516e76d33b1f10578e33df44f90/hidl/keymaster"
          curl -fL --retry 3 "$KM_SRC_BASE/Android.mk" -o "$SAMSUNG_KM/Android.mk"
          curl -fL --retry 3 "$KM_SRC_BASE/service.cpp" -o "$SAMSUNG_KM/service.cpp"
          curl -fL --retry 3 "$KM_SRC_BASE/android.hardware.keymaster@4.0-service.samsung.rc" -o "$SAMSUNG_KM/android.hardware.keymaster@4.0-service.samsung.rc"
          grep -Fq 'LOCAL_MODULE := android.hardware.keymaster@4.0-service.samsung' "$SAMSUNG_KM/Android.mk"
          grep -Fq 'CreateSKeymasterDevice' "$SAMSUNG_KM/service.cpp"

          KM_PREBUILT="$DEVICE/keymaster_prebuilt"
          mkdir -p "$KM_PREBUILT"
          curl -fL --retry 3             "https://raw.githubusercontent.com/samsung-sm8350/proprietary_vendor_samsung/3bf7df25d3fce7a2f09a082cdf2057281bb9760e/sm8350-common/proprietary/vendor/lib64/libskeymaster4device.so"             -o "$KM_PREBUILT/libskeymaster4device.so"
          test "$(stat -c %s "$KM_PREBUILT/libskeymaster4device.so")" -gt 10000
          file "$KM_PREBUILT/libskeymaster4device.so" > "$KM_PREBUILT/libskeymaster4device.file.txt"
          grep -Fq 'ELF 64-bit' "$KM_PREBUILT/libskeymaster4device.file.txt"
          nm -D --defined-only "$KM_PREBUILT/libskeymaster4device.so" > "$KM_PREBUILT/libskeymaster4device.nm.txt"
          c++filt < "$KM_PREBUILT/libskeymaster4device.nm.txt" > "$KM_PREBUILT/libskeymaster4device.symbols.txt"
          grep -Fq 'skeymaster::CreateSKeymasterDevice(android::hardware::keymaster::V4_0::SecurityLevel)' "$KM_PREBUILT/libskeymaster4device.symbols.txt"
          echo '[b2q] Keymaster prebuilt validation OK'

          cat > "$KM_PREBUILT/Android.mk" <<'EOF'
          LOCAL_PATH := $(call my-dir)

          include $(CLEAR_VARS)
          LOCAL_MODULE := libskeymaster4device
          LOCAL_SRC_FILES := libskeymaster4device.so
          LOCAL_MODULE_CLASS := SHARED_LIBRARIES
          LOCAL_MODULE_SUFFIX := .so
          LOCAL_MODULE_TAGS := optional
          LOCAL_MODULE_OWNER := samsung
          LOCAL_VENDOR_MODULE := true
          LOCAL_MULTILIB := 64
          LOCAL_CHECK_ELF_FILES := false
          include $(BUILD_PREBUILT)
          EOF

          if ! grep -Fq 'TARGET_KEYMASTER_VARIANT := samsung' BoardConfig.mk; then
            printf '\n# test6v: Samsung SM8350 Keymaster wrapper\nTARGET_KEYMASTER_VARIANT := samsung\n' >> BoardConfig.mk
          fi
          cat >> device.mk <<'EOF'

          # test6v: build Samsung Keymaster wrapper and copy it into recovery /system/bin.
          TARGET_RECOVERY_DEVICE_MODULES += \
              android.hardware.keymaster@4.0-service.samsung \
              b2q-sp-loader

          RECOVERY_BINARY_SOURCE_FILES += \
              $(TARGET_OUT_VENDOR_EXECUTABLES)/hw/android.hardware.keymaster@4.0-service.samsung \
              $(TARGET_OUT_EXECUTABLES)/b2q-sp-loader
          EOF

          grep -Fq 'TW_INCLUDE_CRYPTO := true' BoardConfig.mk
          grep -Fq 'TW_INCLUDE_CRYPTO_FBE := true' BoardConfig.mk
          grep -Fq 'TW_INCLUDE_FBE_METADATA_DECRYPT := true' BoardConfig.mk
          grep -Fq 'BOARD_USES_QCOM_FBE_DECRYPTION := false' BoardConfig.mk
          ! grep -Fq 'TW_USE_NEW_MINADBD' BoardConfig.mk
          ! grep -Fq 'qcom_decrypt' device.mk
          ! grep -Fq 'import /init.recovery.qcom_decrypt.rc' recovery/root/init.recovery.qcom.rc
          ! grep -Fq 'twrp-otg-watch' recovery/root/init.recovery.qcom.rc
          grep -Fq '/dev/block/sdf1' recovery/root/system/etc/twrp.flags
          grep -Fq 'metadata_encryption=aes-256-xts' recovery/root/system/etc/recovery.fstab
          grep -Fq 'keydirectory=/metadata/vold/metadata_encryption' recovery/root/system/etc/recovery.fstab
          grep -Fq 'TARGET_RECOVERY_DEVICE_MODULES +=' device.mk
          grep -Fq '    libion' device.mk
          grep -Fq '$(TARGET_OUT_SHARED_LIBRARIES)/libion.so' device.mk

          # test6e: stock b2q Keymaster lives on the mounted stock /vendor.
          cat >> recovery/root/init.recovery.qcom.rc <<'EOF'

          # b2q test6g: QSEE daemon required by the stock Keymaster TEE path.
          service vendor.qseecomd /vendor/bin/qseecomd
              override
              class core
              user root
              group root
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              oneshot
              stdio_to_kmsg
              seclabel u:r:recovery:s0

          # b2q test6ap: use the original Keymaster HAL from the mounted b2q /vendor.
          # Keep the Lineage wrapper in the image only as a build/reference control;
          # it is deliberately not used for this test.
          service vendor.keymaster-4-0 /vendor/bin/hw/android.hardware.keymaster@4.0-service
              override
              interface android.hardware.keymaster@4.0::IKeymasterDevice default
              class early_hal
              user system
              group system drmrpc
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              oneshot
              stdio_to_kmsg
              seclabel u:r:recovery:s0

          # b2q test6af: QTI SM8350 exposes StrongBox as an early HAL.
          # Stock init.qti.keymaster.sh selects StrongBox v4.0 for SM8350.
          service vendor.keymaster-sb-4-0 /vendor/bin/hw/android.hardware.keymaster@4.0-strongbox-service-qti
              override
              interface android.hardware.keymaster@4.0::IKeymasterDevice strongbox
              class early_hal
              user system
              group system drmrpc
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              stdio_to_kmsg
              seclabel u:r:recovery:s0

          # b2q test6m: Samsung SM8350 SPU/NVM services required by
          # libskeymaster4device before IKeymasterDevice/default is exposed.
          service vendor.spdaemon /vendor/bin/spdaemon
              override
              class core
              user system
              group system
              shutdown critical
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              stdio_to_kmsg
              seclabel u:r:recovery:s0

          service vendor.sec_nvm /vendor/bin/sec_nvm
              override
              class core
              user system
              group system
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              stdio_to_kmsg
              seclabel u:r:recovery:s0
          EOF
          grep -Fq 'service vendor.qseecomd /vendor/bin/qseecomd' recovery/root/init.recovery.qcom.rc
          test "$(grep -Fc '    override' recovery/root/init.recovery.qcom.rc)" -eq 5
          grep -A8 -F 'service vendor.spdaemon /vendor/bin/spdaemon' recovery/root/init.recovery.qcom.rc | grep -Fq 'shutdown critical'
          ! grep -A10 -F 'service vendor.spdaemon /vendor/bin/spdaemon' recovery/root/init.recovery.qcom.rc | grep -Fq 'oneshot'
          ! grep -A10 -F 'service vendor.sec_nvm /vendor/bin/sec_nvm' recovery/root/init.recovery.qcom.rc | grep -Fq 'oneshot'
          grep -Fq 'service vendor.keymaster-4-0 /vendor/bin/hw/android.hardware.keymaster@4.0-service' recovery/root/init.recovery.qcom.rc
          grep -Fq 'TARGET_KEYMASTER_VARIANT := samsung' BoardConfig.mk
          grep -Fq 'android.hardware.keymaster@4.0-service.samsung' device.mk
          grep -Fq 'service vendor.spdaemon /vendor/bin/spdaemon' recovery/root/init.recovery.qcom.rc
          grep -Fq 'service vendor.sec_nvm /vendor/bin/sec_nvm' recovery/root/init.recovery.qcom.rc
          grep -Fq 'service vendor.keymaster-sb-4-0 /vendor/bin/hw/android.hardware.keymaster@4.0-strongbox-service-qti' recovery/root/init.recovery.qcom.rc
          grep -Fq 'setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin' recovery/root/init.recovery.qcom.rc
          test -f recovery/root/vendor/etc/ueventd.rc
          UEVENTD=recovery/root/vendor/etc/ueventd.rc
          if ! grep -Fq 'firmware_directories /vendor/firmware_mnt/image/ /vendor/firmware-modem/image/ /spu/ /vendor/firmware/wifi/' "$UEVENTD"; then
            {
              echo 'firmware_directories /vendor/firmware_mnt/image/ /vendor/firmware-modem/image/ /spu/ /vendor/firmware/wifi/'
              cat "$UEVENTD"
            } > "$UEVENTD.tmp"
            mv "$UEVENTD.tmp" "$UEVENTD"
          fi
          grep -Fq 'firmware_directories /vendor/firmware_mnt/image/ /vendor/firmware-modem/image/ /spu/ /vendor/firmware/wifi/' "$UEVENTD"
          grep -Fq '/dev/sp_kernel            0660   system     system' recovery/root/vendor/etc/ueventd.rc
          grep -Fq '/dev/sp_keymaster         0660   system     system' recovery/root/vendor/etc/ueventd.rc
          grep -Fq '/dev/qsee_ipc_irq_spss    0660   system     drmrpc' recovery/root/vendor/etc/ueventd.rc
          grep -Fq '/dev/ion                  0664   system     system' recovery/root/vendor/etc/ueventd.rc
          grep -Fq '/dev/ion                  0664   system     system' recovery/root/ueventd.qcom.rc
          grep -Fq 'symlink /vendor/firmware_mnt /firmware' recovery/root/init.recovery.qcom.rc
          test -f recovery/root/system/bin/b2q-security-diag.sh
          bash -n recovery/root/system/bin/b2q-security-diag.sh
          grep -Fq 'stdio_to_kmsg' recovery/root/init.recovery.qcom.rc
          test "$(grep -Fc '              oneshot' .github/workflows/build-test5-deferred.yml 2>/dev/null || true)" -ge 0 || true

          python3 - "$RECOVERY" "$VOLD" <<'PY'
          import sys
          import re
          from pathlib import Path

          root = Path(sys.argv[1])
          vold = Path(sys.argv[2])

          # test6e: bounded keystore2 lookup. Never freeze recovery forever.
          km = vold / 'Keymaster.cpp'
          kmtext = km.read_text()
          inc_old = '#include <android-base/logging.h>\n'
          inc_new = '#include <android-base/logging.h>\n#include <unistd.h>\n'
          if kmtext.count(inc_old) != 1:
              raise SystemExit(f'Keymaster.cpp include anchor count={kmtext.count(inc_old)}')
          kmtext = kmtext.replace(inc_old, inc_new, 1)

          ctor_old = '''Keymaster::Keymaster() {
              ::ndk::SpAIBinder binder(AServiceManager_waitForService(keystore2_service_name));
              auto keystore2Service = ks2::IKeystoreService::fromBinder(binder);
          '''
          ctor_new = '''Keymaster::Keymaster() {
              AIBinder* raw_binder = nullptr;
              for (int attempt = 0; attempt < 50 && raw_binder == nullptr; ++attempt) {
                  raw_binder = AServiceManager_checkService(keystore2_service_name);
                  if (raw_binder == nullptr)
                      usleep(100000);
              }
              if (raw_binder == nullptr) {
                  LOG(ERROR) << "b2q: keystore2 service unavailable after 5 seconds";
                  return;
              }
              ::ndk::SpAIBinder binder(raw_binder);
              auto keystore2Service = ks2::IKeystoreService::fromBinder(binder);
          '''
          if kmtext.count(ctor_old) != 1:
              raise SystemExit(f'Keymaster.cpp ctor anchor count={kmtext.count(ctor_old)}')
          km.write_text(kmtext.replace(ctor_old, ctor_new, 1))

          # test6h: link recovery against Keymaster 4.0 so the GUI action can
          # verify that the HIDL service is actually registered, not merely
          # that the vendor process is alive.
          mk = root / 'Android.mk'
          mktext = mk.read_text()
          mk_old = ('        android.hardware.gatekeeper@1.0 \\\n'
                    '        android.hardware.weaver@1.0 \\\n')
          mk_new = ('        android.hardware.gatekeeper@1.0 \\\n'
                    '        android.hardware.keymaster@4.0 \\\n'
                    '        android.hardware.weaver@1.0 \\\n')
          if mktext.count(mk_old) != 1:
              raise SystemExit(f'Android.mk keymaster link anchor count={mktext.count(mk_old)}')
          mk.write_text(mktext.replace(mk_old, mk_new, 1))

          # test6h: action.cpp is compiled into libguitwrp, so the GUI module
          # itself also needs the Keymaster HIDL dependency for generated headers.
          guibp = root / 'gui/Android.bp'
          bptext = guibp.read_text()
          bp_old = ('        "libselinux",\n'
                    '        "libziparchive"\n'
                    '    ],\n')
          bp_new = ('        "libselinux",\n'
                    '        "libziparchive",\n'
                    '        "android.hardware.keymaster@4.0"\n'
                    '    ],\n')
          if bptext.count(bp_old) != 1:
              raise SystemExit(f'gui/Android.bp shared_libs anchor count={bptext.count(bp_old)}')
          guibp.write_text(bptext.replace(bp_old, bp_new, 1))

          # 1) Keep startup stable: crypto is compiled, but metadata mapping is not
          #    allowed to block Setup_Fstab_Partitions().
          pm = root / 'partitionmanager.cpp'
          text = pm.read_text()
          old = '\t\tDataManager::SetValue(TW_IS_ENCRYPTED, 1);\n\t\tDecrypt_Data();'
          new = ('\t\tDataManager::SetValue(TW_IS_ENCRYPTED, 1);\n'
                 '\t\tLOGINFO("b2q: startup metadata decrypt deferred to manual ActionThread\\n");')
          if text.count(old) != 1:
              raise SystemExit(f'partitionmanager.cpp expected 1 startup decrypt block, got {text.count(old)}')
          pm.write_text(text.replace(old, new, 1))

          # test6j: add dm-default-key/F2FS checkpoints on top of the
          # test6d instrumentation already applied by scripts/prepare-tree.sh.
          text = pm.read_text()

          def pm_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'partitionmanager.cpp {label} anchor count={count}')
              text = text.replace(old, new, 1)

          pm_once(
              '\t\t\tgui_msg("b2q_metadata_start=[b2q] METADATA START");\n',
              '\t\t\tgui_msg("b2q_metadata_map_start=[b2q] METADATA MAP START");\n'
              '\t\t\tLOGINFO("b2q: metadata input actual=\\\'%s\\\' fs=\\\'%s\\\' mount_opts=\\\'%s\\\' keydir=\\\'%s\\\'\\n", '
              'Decrypt_Data->Actual_Block_Device.c_str(), Decrypt_Data->Current_File_System.c_str(), '
              'Decrypt_Data->Mount_Options.c_str(), Decrypt_Data->Key_Directory.c_str());\n'
              '\t\t\tgui_msg("b2q_metadata_start=[b2q] METADATA START");\n',
              'metadata start')

          pm_once(
              '\t\t\t\tLOGINFO("Successfully decrypted metadata encrypted data partition with new block device: \'%s\'\\n", crypto_blkdev.c_str());\n',
              '\t\t\t\tLOGINFO("Successfully decrypted metadata encrypted data partition with new block device: \'%s\'\\n", crypto_blkdev.c_str());\n'
              '\t\t\t\tgui_msg("b2q_dm_default_key_ready=[b2q] DM DEFAULT KEY READY");\n'
              '\t\t\t\tstd::string b2q_dm_diag;\n'
              '\t\t\t\tTWFunc::Exec_Cmd("echo \'--- /dev/block/mapper ---\'; ls -la /dev/block/mapper 2>&1 || true; '
              'echo \'--- dm nodes ---\'; ls -la /dev/block/dm-* 2>&1 || true; '
              'echo \'--- dm sysfs ---\'; for d in /sys/class/block/dm-*; do [ -e \\\"$d\\\" ] || continue; '
              'echo \\\"[$d]\\\"; cat \\\"$d/dm/name\\\" 2>/dev/null || true; cat \\\"$d/dm/uuid\\\" 2>/dev/null || true; done; '
              'echo \'--- crypto blkdev ---\'; getprop ro.crypto.fs_crypto_blkdev; '
              'echo \'--- resolved ---\'; readlink -f \\\"" + crypto_blkdev + "\\\" 2>/dev/null || true; '
              'echo \'--- data mount ---\'; grep \' /data \' /proc/mounts || true", b2q_dm_diag, true);\n'
              '\t\t\t\tLOGINFO("b2q: dm-default-key diagnostics:\\n%s\\n", b2q_dm_diag.c_str());\n',
              'dm ready')

          pm_once(
              '\t\t\t\tgui_msg("b2q_data_mount_start=[b2q] DATA MOUNT START");\n',
              '\t\t\t\tgui_msg("b2q_data_mount_start=[b2q] DATA MOUNT START");\n'
              '\t\t\t\tgui_msg("b2q_f2fs_mount_start=[b2q] F2FS MOUNT START");\n',
              'f2fs start')

          pm_once(
              '\t\t\t\t\tgui_msg("b2q_data_mount_ok=[b2q] DATA MOUNT OK");\n',
              '\t\t\t\t\tgui_msg("b2q_data_mount_ok=[b2q] DATA MOUNT OK");\n'
              '\t\t\t\t\tgui_msg("b2q_f2fs_mount_ok=[b2q] F2FS MOUNT OK");\n',
              'f2fs success')

          pm_once(
              '\t\t\t\t} else {\n\t\t\t\t\tLOGINFO("Failed to mount data after metadata decrypt\\n");\n\t\t\t\t}\n',
              '\t\t\t\t} else {\n'
              '\t\t\t\t\tstd::string b2q_f2fs_diag;\n'
              '\t\t\t\t\tTWFunc::Exec_Cmd("echo \'--- data block ---\'; ls -la \\\"" + Decrypt_Data->Decrypted_Block_Device + "\\\" 2>&1 || true; '
              'echo \'--- mounts ---\'; grep \' /data \' /proc/mounts || true; '
              'echo \'--- f2fs/dm dmesg ---\'; dmesg | grep -Ei \'f2fs|dm-|device-mapper|fscrypt|metadata|userdata\' | tail -n 160", b2q_f2fs_diag, true);\n'
              '\t\t\t\t\tLOGINFO("b2q: F2FS mount failure diagnostics:\\n%s\\n", b2q_f2fs_diag.c_str());\n'
              '\t\t\t\t\tgui_err("b2q_f2fs_mount_fail=[b2q] F2FS MOUNT FAIL");\n'
              '\t\t\t\t\tLOGINFO("Failed to mount data after metadata decrypt\\n");\n'
              '\t\t\t\t}\n',
              'f2fs failure')

          pm_once(
              '\t\t\t} else {\n\t\t\t\tLOGINFO("Unable to decrypt metadata encryption\\n");\n\t\t\t}\n',
              '\t\t\t} else {\n'
              '\t\t\t\tgui_err("b2q_metadata_map_fail=[b2q] METADATA MAP FAIL");\n'
              '\t\t\t\tLOGINFO("Unable to decrypt metadata encryption\\n");\n'
              '\t\t\t}\n',
              'metadata failure')

          pm.write_text(text)

          # 2) Add a dedicated threaded GUI action that prepares metadata/FBE only.
          objects = root / 'gui/objects.hpp'
          text = objects.read_text()
          old = '\tint decrypt(std::string arg);\n'
          new = '\tint preparedecrypt(std::string arg);\n\tint decrypt(std::string arg);\n'
          if text.count(old) != 1:
              raise SystemExit(f'objects.hpp expected 1 decrypt declaration, got {text.count(old)}')
          objects.write_text(text.replace(old, new, 1))

          action = root / 'gui/action.cpp'
          text = action.read_text()
          include_old = '#include <android-base/properties.h>\n'
          include_new = '#include <android-base/properties.h>\n#include <android/hardware/keymaster/4.0/IKeymasterDevice.h>\n#include <algorithm>\n'
          if text.count(include_old) != 1:
              raise SystemExit(f'action.cpp keymaster include anchor count={text.count(include_old)}')
          text = text.replace(include_old, include_new, 1)
          old = '\t\tADD_ACTION(decrypt);\n'
          new = '\t\tADD_ACTION(preparedecrypt);\n\t\tADD_ACTION(decrypt);\n'
          if text.count(old) != 1:
              raise SystemExit(f'action.cpp expected 1 decrypt registration, got {text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = 'int GUIAction::decrypt(std::string arg __unused)\n{'
          prepare = '''int GUIAction::preparedecrypt(std::string arg __unused)
          {
          \tint op_status = 1;

          \toperation_start("Prepare Data Decryption");
          \tif (simulate) {
          \t\tsimulate_progress_bar();
          \t\top_status = 0;
          \t} else {
          \t\tLOGINFO("b2q: manual metadata decrypt preparation starting\\n");
          \t\tgui_msg("b2q_vendor_mount_start=[b2q] VENDOR MOUNT START");
          \t\tif (!PartitionManager.Mount_By_Path("/vendor", false)) {
          \t\t\tgui_err("b2q_vendor_mount_fail=[b2q] VENDOR MOUNT FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_vendor_mount_ok=[b2q] VENDOR MOUNT OK");

          \t\tgui_msg("b2q_efs_mount_start=[b2q] EFS MOUNT START");
          \t\tif (!PartitionManager.Mount_By_Path("/efs", false)) {
          \t\t\tgui_err("b2q_efs_mount_fail=[b2q] EFS MOUNT FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tTWFunc::Recursive_Mkdir("/mnt/vendor/efs");
          \t\tif (TWFunc::Exec_Cmd("mount -o bind /efs /mnt/vendor/efs", false) != 0) {
          \t\t\tgui_err("b2q_efs_bind_fail=[b2q] EFS BIND FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_efs_bind_ok=[b2q] EFS BIND OK");

          \t\tgui_print("[b2q] FIRMWARE PROBE START\\n");
          \t\tstd::string fw_diag;
          \t\tint fw_status = TWFunc::Exec_Cmd("/system/bin/sh /system/bin/b2q-firmware-probe.sh", fw_diag, true);
          \t\tLOGINFO("b2q: firmware probe diagnostics:\\n%s\\n", fw_diag.c_str());
          \t\tgui_print("[b2q] FIRMWARE PROBE rc=%d\\n", fw_status);
          \t\tif (fw_status != 0) {
          \t\t\tLOGINFO("b2q: firmware probe exit status: %d; continuing into stock QSEE/Keymaster path\\n", fw_status);
          \t\t\tgui_print("[b2q] FIRMWARE IMAGE MISSING - CONTINUE\\n");
          \t\t} else {
          \t\t\tgui_print("[b2q] FIRMWARE READY\\n");
          \t\t}
          \t\tif (!TWFunc::Path_Exists("/vendor/bin/qseecomd")) {
          \t\t\tgui_print_color("error", "[b2q] STOCK QSEECOMD BINARY MISSING\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tif (!TWFunc::Path_Exists("/system/bin/android.hardware.keymaster@4.0-service.samsung")) {
          \t\t\tgui_print_color("error", "[b2q] SAMSUNG KEYMASTER WRAPPER MISSING\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] QSEE + SAMSUNG KEYMASTER WRAPPER OK\\n");

          \t\tgui_msg("b2q_dak_start=[b2q] DAK PREP START");
          \t\tif (TWFunc::Exec_Cmd("mkdir -p /mnt/vendor/efs/DAK && chown 1000:1000 /mnt/vendor/efs/DAK && chmod 0775 /mnt/vendor/efs/DAK && if [ -e /mnt/vendor/efs/DAK/gakkeybox ]; then chown 1000:1000 /mnt/vendor/efs/DAK/gakkeybox; chmod 0644 /mnt/vendor/efs/DAK/gakkeybox; fi && restorecon -R /mnt/vendor/efs/DAK >/dev/null 2>&1 || true", false) != 0) {
          \t\t\tgui_err("b2q_dak_fail=[b2q] DAK PREP FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_dak_ok=[b2q] DAK PREP OK");

          \t\tgui_msg("b2q_qsee_dev_start=[b2q] QSEE DEVICE WAIT");
          \t\tfor (int i = 0; i < 50 && !TWFunc::Path_Exists("/dev/qseecom"); ++i)
          \t\t\tusleep(100000);
          \t\tif (!TWFunc::Path_Exists("/dev/qseecom")) {
          \t\t\tgui_err("b2q_qsee_dev_fail=[b2q] QSEE DEVICE FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_qsee_start=[b2q] QSEECOMD START");
          \t\tandroid::base::SetProperty("ctl.start", "vendor.qseecomd");
          \t\tint qsee_stable = 0;
          \t\tfor (int i = 0; i < 100 && qsee_stable < 20; ++i) {
          \t\t\tif (android::base::GetProperty("init.svc.vendor.qseecomd", "") == "running")
          \t\t\t\t++qsee_stable;
          \t\t\telse
          \t\t\t\tqsee_stable = 0;
          \t\t\tusleep(100000);
          \t\t}
          \t\tif (qsee_stable < 20) {
          \t\t\tstd::string sec_diag;
          \t\t\tTWFunc::Exec_Cmd("/system/bin/sh /system/bin/b2q-security-diag.sh", sec_diag, true);
          \t\t\tLOGINFO("b2q: QSEE unstable diagnostics:\\n%s\\n", sec_diag.c_str());
          \t\t\tgui_print_color("error", "[b2q] QSEECOMD UNSTABLE\\n");
          \t\t\tgui_print("%s\\n", sec_diag.c_str());
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] QSEECOMD STABLE\\n");

          \t\t// test6w: bring up NVM before SPU. In recovery ctl.start can let
          \t\t// spdaemon reach the SPU before sec_nvm has registered its server;
          \t\t// the SP firmware does not reliably retry that first NVM handshake.
          \t\tstd::string pstore_diag;
          \t\tTWFunc::Exec_Cmd("if [ -d /sys/fs/pstore ]; then for f in /sys/fs/pstore/*; do [ -f \\\"$f\\\" ] || continue; echo \\\"=== $f ===\\\"; cat \\\"$f\\\"; done; fi", pstore_diag, true);
          \t\tif (!pstore_diag.empty()) {
          \t\t\tLOGINFO("b2q: previous reboot pstore:\\n%s\\n", pstore_diag.c_str());
          \t\t\tgui_print("[b2q] PREVIOUS CRASH PSTORE FOUND\\n");
          \t\t} else {
          \t\t\tgui_print("[b2q] PREVIOUS CRASH PSTORE EMPTY\\n");
          \t\t}

          \t\tgui_print("[b2q] SPU PREFLIGHT START\\n");
          \t\tTWFunc::Recursive_Mkdir("/mnt/vendor/persist");
          \t\tTWFunc::Recursive_Mkdir("/spu");

          \t\t// postrecoveryboot.sh marks partitions not on its allowlist read-only.
          \t\t// sec_nvm needs persist writable, so undo only that block-device flag
          \t\t// immediately before mounting persist for the SPU stack.
          \t\tif (TWFunc::Exec_Cmd("blockdev --setrw /dev/block/bootdevice/by-name/persist && [ \\"$(blockdev --getro /dev/block/bootdevice/by-name/persist)\\" = 0 ]", false) != 0) {
          \t\t\tgui_print_color("error", "[b2q] PERSIST BLOCKDEV RW FAIL\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] PERSIST BLOCKDEV RW READY\\n");

          \t\tif (TWFunc::Exec_Cmd("mountpoint -q /mnt/vendor/persist || mount -t ext4 -o rw,noatime,nosuid,nodev /dev/block/bootdevice/by-name/persist /mnt/vendor/persist", false) != 0) {
          \t\t\tgui_print_color("error", "[b2q] PERSIST DIRECT MOUNT FAIL\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] PERSIST DIRECT RW READY\\n");

          \t\tif (TWFunc::Exec_Cmd("mountpoint -q /spu || mount -t ext4 -o ro,noatime,nosuid,nodev /dev/block/bootdevice/by-name/spu /spu", false) != 0) {
          \t\t\tgui_print_color("error", "[b2q] SPU FIRMWARE MOUNT FAIL\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SPU FIRMWARE READY\\n");

          \t\tif (TWFunc::Exec_Cmd("mkdir -p /mnt/vendor/persist/iar_db /mnt/vendor/persist/secnvm && chown 1000:1000 /mnt/vendor/persist/iar_db /mnt/vendor/persist/secnvm && chmod 0770 /mnt/vendor/persist/iar_db /mnt/vendor/persist/secnvm", false) != 0) {
          \t\t\tgui_print_color("error", "[b2q] SPU DIR PREP FAIL\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SPU DIRS READY\\n");

          \t\tstd::string spu_fw_diag;
          \t\tint spu_fw_rc = TWFunc::Exec_Cmd("/system/bin/sh /system/bin/b2q-spu-firmware-probe.sh", spu_fw_diag, true);
          \t\tLOGINFO("b2q: SPU firmware finder diagnostics:\\n%s\\n", spu_fw_diag.c_str());
          \t\tgui_print("%s\\n", spu_fw_diag.c_str());
          \t\tif (spu_fw_rc != 0) {
          \t\t\tgui_print_color("error", "[b2q] SPU FIRMWARE FIND FAIL rc=%d\\n", spu_fw_rc);
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SPU FIRMWARE FIND OK\\n");

          \t\tstd::string sp_app_diag;
          \t\tint sp_app_rc = TWFunc::Exec_Cmd("/system/bin/sh /system/bin/b2q-sp-app-probe.sh", sp_app_diag, true);
          \t\tLOGINFO("b2q: SP app signature diagnostics:\\n%s\\n", sp_app_diag.c_str());
          \t\tgui_print("%s\\n", sp_app_diag.c_str());
          \t\tif (sp_app_rc != 0) {
          \t\t\tgui_print_color("error", "[b2q] SP APP SIGNATURE PREP FAIL rc=%d\\n", sp_app_rc);
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SP APP SIGNATURES READY\\n");

          \t\t// test6af: restore the stock SM8350 sequence. Qualcomm's
          \t\t// init.qti.keymaster.sh sets StrongBox v4.0 on SM8350 before
          \t\t// the early HAL starts; post-fs then starts spdaemon -> sec_nvm.
          \t\tgui_print("[b2q] STOCK SPU ORDER START\\n");

          \t\tstd::string soc_id_diag;
          \t\tTWFunc::Exec_Cmd("cat /sys/devices/soc0/soc_id 2>/dev/null || cat /sys/devices/system/soc/soc0/id 2>/dev/null || true", soc_id_diag, true);
          \t\tsoc_id_diag.erase(std::remove(soc_id_diag.begin(), soc_id_diag.end(), '\\n'), soc_id_diag.end());
          \t\tgui_print("[b2q] SOC_ID=%s\\n", soc_id_diag.c_str());

          \t\t// b2q is SM8350. This is the exact property selected by QTI's
          \t\t// init.qti.keymaster.sh for SM8350 soc_id 415/439/456.
          \t\tandroid::base::SetProperty("vendor.keymaster.strongbox.version", "40");
          \t\tgui_print("[b2q] STRONGBOX VERSION=%s\\n",
          \t\t\tandroid::base::GetProperty("vendor.keymaster.strongbox.version", "missing").c_str());

          \t\tbool have_sb = TWFunc::Path_Exists("/vendor/bin/hw/android.hardware.keymaster@4.0-strongbox-service-qti");
          \t\tgui_print("[b2q] STRONGBOX BINARY=%s\\n", have_sb ? "present" : "missing");
          \t\tif (have_sb) {
          \t\t\tandroid::base::SetProperty("ctl.start", "vendor.keymaster-sb-4-0");
          \t\t\tfor (int i = 0; i < 30 && android::base::GetProperty("init.svc.vendor.keymaster-sb-4-0", "") != "running"; ++i)
          \t\t\t\tusleep(100000);
          \t\t\tgui_print("[b2q] STRONGBOX STATE=%s\\n",
          \t\t\t\tandroid::base::GetProperty("init.svc.vendor.keymaster-sb-4-0", "unknown").c_str());
          \t\t}

          \t\tgui_print("[b2q] SPDAEMON STOCK FIRST START\\n");
          \t\tandroid::base::SetProperty("ctl.start", "vendor.spdaemon");
          \t\tfor (int i = 0; i < 50 && android::base::GetProperty("init.svc.vendor.spdaemon", "") != "running"; ++i)
          \t\t\tusleep(100000);
          \t\tif (android::base::GetProperty("init.svc.vendor.spdaemon", "") != "running") {
          \t\t\tgui_print_color("error", "[b2q] SPDAEMON STOCK START FAIL\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SPDAEMON RUNNING - START SEC_NVM NOW\\n");

          \t\t// Important: no pre-start delay here. This mirrors init.spdaemon.rc.
          \t\tandroid::base::SetProperty("ctl.start", "vendor.sec_nvm");
          \t\tfor (int i = 0; i < 50 && android::base::GetProperty("init.svc.vendor.sec_nvm", "") != "running"; ++i)
          \t\t\tusleep(100000);
          \t\tif (android::base::GetProperty("init.svc.vendor.sec_nvm", "") != "running") {
          \t\t\tgui_print_color("error", "[b2q] SEC_NVM STOCK START FAIL\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SEC_NVM RUNNING\\n");

          \t\t// test6ai: on SM8350 stock spdaemon treats keymaster as a UEFI app.
          \t\t// If recovery lost that UEFI-loaded app, spdaemon updates status but
          \t\t// deliberately does not call spcom_load_app() for sp_keymaster.
          \t\t// Our loader waits for spdaemon's SPU-ready event first, then forces
          \t\t// the exact keym*.sig selected by b2q-sp-app-probe.sh.
          \t\tgui_print("[b2q] FORCED KEYMASTER APP TEST START\\n");
          \t\tstd::string forced_km_diag;
          \t\tint forced_km_rc = TWFunc::Exec_Cmd(
          \t\t\t"KM_SIG=$(cat /tmp/b2q-sp-keymaster-sig 2>/dev/null); "
          \t\t\t"echo forced_keymaster_sig=$KM_SIG; "
          \t\t\t"if [ -z \\"$KM_SIG\\" ] || [ ! -r \\"$KM_SIG\\" ]; then echo forced_keymaster_sig_unreadable; exit 80; fi; "
          \t\t\t"/system/bin/b2q-sp-loader sp_keymaster \\"$KM_SIG\\" 262144; RC=$?; "
          \t\t\t"echo forced_keymaster_loader_rc=$RC; "
          \t\t\t"echo forced_nodes; ls -l /dev/asym_cryptoapp /dev/cryptoapp /dev/sp_keymaster /dev/sec_nvm_* /dev/spdaemon_ssr 2>&1 || true; "
          \t\t\t"echo forced_props; getprop | grep -Ei 'spcom|spu|spss|keymaster.strongbox|init.svc.vendor.(spdaemon|sec_nvm|keymaster-sb)' || true; "
          \t\t\t"exit $RC",
          \t\t\tforced_km_diag, true);
          \t\tLOGINFO("b2q: forced keymaster SP app diagnostics:\\n%s\\n", forced_km_diag.c_str());
          \t\tgui_print("%s\\n", forced_km_diag.c_str());

          \t\tif (forced_km_rc != 0) {
          \t\t\tstd::string sp_fail_diag;
          \t\t\tTWFunc::Exec_Cmd("echo '--- forced SP keymaster failure ---'; /system/bin/sh /system/bin/b2q-security-diag.sh; echo '--- keymaster sig ---'; cat /tmp/b2q-sp-keymaster-sig 2>/dev/null; ls -l /vendor/firmware_mnt/image/keym*.sig 2>&1; echo '--- strongbox ---'; getprop | grep -Ei 'keymaster-sb|strongbox'; logcat -b all -d -v brief 2>/dev/null | grep -Ei 'spdaemon|spcom|sp_keymaster|cryptoapp|sec_nvm|strongbox|keymaster|nvm_ready|spu_ready' | tail -n 420; dmesg | grep -Ei 'spu|spss|spcom|remoteproc|watchdog|fatal|ssr' | tail -n 340", sp_fail_diag, true);
          \t\t\tLOGINFO("b2q: forced keymaster SP app failed:\\n%s\\n", sp_fail_diag.c_str());
          \t\t\tgui_print_color("error", "[b2q] FORCED SP KEYMASTER LOAD FAIL\\n");
          \t\t\tgui_print("%s\\n", sp_fail_diag.c_str());
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] FORCED SP KEYMASTER LOAD OK\\n");
          \t\tif (TWFunc::Path_Exists("/dev/sp_keymaster"))
          \t\t\tgui_print("[b2q] SP KEYMASTER NODE=present\\n");
          \t\telse
          \t\t\tgui_print("[b2q] SP KEYMASTER NODE=missing (app already loaded is acceptable)\\n");
          \t\tgui_print("[b2q] SP KEYMASTER APP READY\\n");

          \t\t// test6an: Samsung SKeymaster blocks in waitStrongBoxKeymaster()
          \t\t// until IKeymasterDevice/strongbox is really registered. A running
          \t\t// init service is not sufficient. Re-check after SPU is ready and
          \t\t// restart StrongBox once if it was started too early.
          \t\tgui_print("[b2q] STRONGBOX HAL CHECK\\n");
          \t\tandroid::sp<android::hardware::keymaster::V4_0::IKeymasterDevice> strongbox_hal;
          \t\tfor (int i = 0; i < 30 && strongbox_hal == nullptr; ++i) {
          \t\t\tstrongbox_hal = android::hardware::keymaster::V4_0::IKeymasterDevice::tryGetService("strongbox", false);
          \t\t\tif (strongbox_hal == nullptr)
          \t\t\t\tusleep(100000);
          \t\t}
          \t\tif (strongbox_hal == nullptr) {
          \t\t\tstd::string sb_before;
          \t\t\tTWFunc::Exec_Cmd(
          \t\t\t\t"echo '--- StrongBox before restart ---'; "
          \t\t\t\t"echo state=$(getprop init.svc.vendor.keymaster-sb-4-0); "
          \t\t\t\t"PID=$(pidof android.hardware.keymaster@4.0-strongbox-service-qti 2>/dev/null | awk '{print $1}'); "
          \t\t\t\t"echo pid=$PID; if [ -n \\\"$PID\\\" ]; then echo -n 'wchan='; cat /proc/$PID/wchan 2>/dev/null; cat /proc/$PID/status 2>/dev/null | grep -E '^(Name|State|Pid|Threads)'; fi; "
          \t\t\t\t"logcat -b all -d -v brief 2>/dev/null | grep -Ei 'StrongBox|strongbox|keymaster-sb|ssp|SPU|spcom' | tail -n 180",
          \t\t\t\tsb_before, true);
          \t\t\tLOGINFO("b2q: StrongBox before restart:\\n%s\\n", sb_before.c_str());
          \t\t\tgui_print("%s\\n", sb_before.c_str());
          \t\t\tgui_print("[b2q] STRONGBOX HAL MISSING - RESTART AFTER SPU READY\\n");
          \t\t\tandroid::base::SetProperty("ctl.stop", "vendor.keymaster-sb-4-0");
          \t\t\tusleep(300000);
          \t\t\tandroid::base::SetProperty("ctl.start", "vendor.keymaster-sb-4-0");
          \t\t\tfor (int i = 0; i < 100 && strongbox_hal == nullptr; ++i) {
          \t\t\t\tstrongbox_hal = android::hardware::keymaster::V4_0::IKeymasterDevice::tryGetService("strongbox", false);
          \t\t\t\tif (strongbox_hal == nullptr)
          \t\t\t\t\tusleep(100000);
          \t\t\t}
          \t\t}
          \t\tif (strongbox_hal == nullptr) {
          \t\t\tstd::string sb_fail;
          \t\t\tTWFunc::Exec_Cmd(
          \t\t\t\t"echo '=== STRONGBOX HAL FAIL ==='; "
          \t\t\t\t"echo state=$(getprop init.svc.vendor.keymaster-sb-4-0); "
          \t\t\t\t"PID=$(pidof android.hardware.keymaster@4.0-strongbox-service-qti 2>/dev/null | awk '{print $1}'); "
          \t\t\t\t"echo pid=$PID; if [ -n \\\"$PID\\\" ]; then echo -n 'wchan='; cat /proc/$PID/wchan 2>/dev/null; echo '--- syscall ---'; cat /proc/$PID/syscall 2>/dev/null || true; echo '--- status ---'; grep -E '^(Name|State|Pid|PPid|Threads|Sig|Cap)' /proc/$PID/status 2>/dev/null || true; echo '--- fds ---'; ls -l /proc/$PID/fd 2>/dev/null | head -n 80; fi; "
          \t\t\t\t"echo '--- StrongBox logcat ---'; logcat -b all -d -v brief 2>/dev/null | grep -Ei 'StrongBox|strongbox|keymaster-sb|ssp|SPU|spcom|QSEE|fatal|error|fail' | tail -n 280; "
          \t\t\t\t"echo '--- nodes ---'; ls -l /dev/ion /dev/cryptoapp /dev/asym_cryptoapp /dev/sp_keymaster /dev/sec_nvm_* 2>&1 || true",
          \t\t\t\tsb_fail, true);
          \t\t\tLOGINFO("b2q: StrongBox HAL failed:\\n%s\\n", sb_fail.c_str());
          \t\t\tgui_print_color("error", "[b2q] STRONGBOX HAL FAIL\\n");
          \t\t\tgui_print("%s\\n", sb_fail.c_str());
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] STRONGBOX HAL READY\\n");

          \t\t// test6ak: the Samsung QSEE helper does not use the SPU keymp.sig
          \t\t// name here. libkeymaster_helper.so points at
          \t\t// /vendor/firmware_mnt/image/ and opens the QSEE app "skeymast".
          \t\t// Keep apnhlos in place for SPU. Only if skeymast is absent there
          \t\t// but present in the already-mounted modem tree, bind modem/image
          \t\t// over the image directory immediately before starting Keymaster.
          \t\tgui_print("[b2q] SKEYMAST TA CHECK\\n");
          \t\tstd::string qsee_fw_diag;
          \t\tint qsee_fw_rc = TWFunc::Exec_Cmd(
          \t\t\t"echo helper_path=/vendor/firmware_mnt/image/; echo helper_app=skeymast; "
          \t\t\t"echo fstab_suffix=$(getprop ro.boot.fstab_suffix); "
          \t\t\t"echo '--- firmware mounts ---'; grep -E 'firmware_mnt|firmware-modem' /proc/mounts || true; "
          \t\t\t"echo '--- current skeymast TA ---'; ls -l /vendor/firmware_mnt/image/skeymast* 2>&1 || true; "
          \t\t\t"echo '--- modem skeymast TA ---'; ls -l /vendor/firmware-modem/image/skeymast* 2>&1 || true; "
          \t\t\t"if ls /vendor/firmware_mnt/image/skeymast* >/dev/null 2>&1; then "
          \t\t\t"  echo QSEE_TA_SOURCE=current-apnhlos; exit 0; "
          \t\t\t"fi; "
          \t\t\t"if ls /vendor/firmware-modem/image/skeymast* >/dev/null 2>&1; then "
          \t\t\t"  echo QSEE_TA_SOURCE=modem-candidate; "
          \t\t\t"  mount -o bind /vendor/firmware-modem/image /vendor/firmware_mnt/image || exit 61; "
          \t\t\t"  echo QSEE_TA_SOURCE=modem-bind; "
          \t\t\t"  ls -l /vendor/firmware_mnt/image/skeymast* 2>&1; "
          \t\t\t"  exit 0; "
          \t\t\t"fi; "
          \t\t\t"echo QSEE_TA_SOURCE=missing; "
          \t\t\t"find /vendor/firmware_mnt /vendor/firmware-modem /vendor/firmware -maxdepth 3 -iname 'skeymast*' -o -iname 'keymaste*' 2>/dev/null | head -n 120; "
          \t\t\t"exit 63",
          \t\t\tqsee_fw_diag, true);
          \t\tLOGINFO("b2q: Samsung QSEE skeymast diagnostics:\\n%s\\n", qsee_fw_diag.c_str());
          \t\tgui_print("%s\\n", qsee_fw_diag.c_str());
          \t\tif (qsee_fw_rc != 0) {
          \t\t\tgui_print("[b2q] SKEYMAST TA unavailable rc=%d - CONTINUE SPU PATH\\n", qsee_fw_rc);
          \t\t} else {
          \t\t\tgui_print("[b2q] SKEYMAST TA READY\\n");
          \t\t}

          \t\tstd::string spu_handoff_pre;
          \t\tTWFunc::Exec_Cmd(
          \t\t\t"echo '--- SPU handoff precheck ---'; "
          \t\t\t"echo sku=$(getprop ro.boot.product.vendor.sku); "
          \t\t\t"echo hardware=$(getprop ro.boot.hardware); "
          \t\t\t"echo board=$(getprop ro.board.platform); "
