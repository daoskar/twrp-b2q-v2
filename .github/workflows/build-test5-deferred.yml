name: Build TWRP b2q stock SPU order test6t

on:
  push:
    branches:
      - test6t-stock-spu-order
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop openjdk-11-jdk pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP 12.1 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          "$HOME/bin/repo" init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          "$HOME/bin/repo" sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Checkout test6t device tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: twrp/device/samsung/b2q

      - name: Prepare stable baseline and manual metadata action
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$GITHUB_WORKSPACE/twrp/device/samsung/b2q"
          RECOVERY="$GITHUB_WORKSPACE/twrp/bootable/recovery"
          VOLD="$GITHUB_WORKSPACE/twrp/system/vold"
          cd "$DEVICE"
          bash scripts/prepare-tree.sh

          grep -Fq 'TW_INCLUDE_CRYPTO := true' BoardConfig.mk
          grep -Fq 'TW_INCLUDE_CRYPTO_FBE := true' BoardConfig.mk
          grep -Fq 'TW_INCLUDE_FBE_METADATA_DECRYPT := true' BoardConfig.mk
          grep -Fq 'BOARD_USES_QCOM_FBE_DECRYPTION := false' BoardConfig.mk
          ! grep -Fq 'TW_USE_NEW_MINADBD' BoardConfig.mk
          ! grep -Fq 'qcom_decrypt' device.mk
          ! grep -Fq 'import /init.recovery.qcom_decrypt.rc' recovery/root/init.recovery.qcom.rc
          ! grep -Fq 'twrp-otg-watch' recovery/root/init.recovery.qcom.rc
          grep -Fq '/dev/block/sdf1' recovery/root/system/etc/twrp.flags
          grep -Fq 'metadata_encryption=aes-256-xts' recovery/root/system/etc/recovery.fstab
          grep -Fq 'keydirectory=/metadata/vold/metadata_encryption' recovery/root/system/etc/recovery.fstab
          grep -Fq 'TARGET_RECOVERY_DEVICE_MODULES +=' device.mk
          grep -Fq '    libion' device.mk
          grep -Fq '$(TARGET_OUT_SHARED_LIBRARIES)/libion.so' device.mk

          # test6e: stock b2q Keymaster lives on the mounted stock /vendor.
          cat >> recovery/root/init.recovery.qcom.rc <<'EOF'

          # b2q test6g: QSEE daemon required by the stock Keymaster TEE path.
          service vendor.qseecomd /vendor/bin/qseecomd
              override
              class core
              user root
              group root
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              oneshot
              stdio_to_kmsg
              seclabel u:r:recovery:s0

          # b2q test6i: match the stock q2q Keymaster runtime identity.
          service vendor.keymaster-4-0 /vendor/bin/hw/android.hardware.keymaster@4.0-service
              override
              interface android.hardware.keymaster@4.0::IKeymasterDevice default
              class early_hal
              user system
              group system drmrpc
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              oneshot
              stdio_to_kmsg
              seclabel u:r:recovery:s0

          # b2q test6m: Samsung SM8350 SPU/NVM services required by
          # libskeymaster4device before IKeymasterDevice/default is exposed.
          service vendor.spdaemon /vendor/bin/spdaemon
              override
              class core
              user system
              group system
              shutdown critical
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              stdio_to_kmsg
              seclabel u:r:recovery:s0

          service vendor.sec_nvm /vendor/bin/sec_nvm
              override
              class core
              user system
              group system
              setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin
              disabled
              stdio_to_kmsg
              seclabel u:r:recovery:s0
          EOF
          grep -Fq 'service vendor.qseecomd /vendor/bin/qseecomd' recovery/root/init.recovery.qcom.rc
          test "$(grep -Fc '    override' recovery/root/init.recovery.qcom.rc)" -eq 4
          grep -A8 -F 'service vendor.spdaemon /vendor/bin/spdaemon' recovery/root/init.recovery.qcom.rc | grep -Fq 'shutdown critical'
          ! grep -A10 -F 'service vendor.spdaemon /vendor/bin/spdaemon' recovery/root/init.recovery.qcom.rc | grep -Fq 'oneshot'
          ! grep -A10 -F 'service vendor.sec_nvm /vendor/bin/sec_nvm' recovery/root/init.recovery.qcom.rc | grep -Fq 'oneshot'
          grep -Fq 'service vendor.keymaster-4-0 /vendor/bin/hw/android.hardware.keymaster@4.0-service' recovery/root/init.recovery.qcom.rc
          grep -Fq 'service vendor.spdaemon /vendor/bin/spdaemon' recovery/root/init.recovery.qcom.rc
          grep -Fq 'service vendor.sec_nvm /vendor/bin/sec_nvm' recovery/root/init.recovery.qcom.rc
          grep -Fq 'setenv LD_LIBRARY_PATH /vendor/lib64:/vendor/lib:/system/lib64:/system/lib:/sbin' recovery/root/init.recovery.qcom.rc
          test -f recovery/root/vendor/etc/ueventd.rc
          UEVENTD=recovery/root/vendor/etc/ueventd.rc
          if ! grep -Fq 'firmware_directories /vendor/firmware_mnt/image/ /vendor/firmware-modem/image/ /spu/ /vendor/firmware/wifi/' "$UEVENTD"; then
            {
              echo 'firmware_directories /vendor/firmware_mnt/image/ /vendor/firmware-modem/image/ /spu/ /vendor/firmware/wifi/'
              cat "$UEVENTD"
            } > "$UEVENTD.tmp"
            mv "$UEVENTD.tmp" "$UEVENTD"
          fi
          grep -Fq 'firmware_directories /vendor/firmware_mnt/image/ /vendor/firmware-modem/image/ /spu/ /vendor/firmware/wifi/' "$UEVENTD"
          grep -Fq '/dev/sp_kernel            0660   system     system' recovery/root/vendor/etc/ueventd.rc
          grep -Fq '/dev/sp_keymaster         0660   system     system' recovery/root/vendor/etc/ueventd.rc
          grep -Fq '/dev/qsee_ipc_irq_spss    0660   system     drmrpc' recovery/root/vendor/etc/ueventd.rc
          test -f recovery/root/system/bin/b2q-security-diag.sh
          bash -n recovery/root/system/bin/b2q-security-diag.sh
          grep -Fq 'stdio_to_kmsg' recovery/root/init.recovery.qcom.rc
          test "$(grep -Fc '              oneshot' .github/workflows/build-test5-deferred.yml 2>/dev/null || true)" -ge 0 || true

          python3 - "$RECOVERY" "$VOLD" <<'PY'
          import sys
          import re
          from pathlib import Path

          root = Path(sys.argv[1])
          vold = Path(sys.argv[2])

          # test6e: bounded keystore2 lookup. Never freeze recovery forever.
          km = vold / 'Keymaster.cpp'
          kmtext = km.read_text()
          inc_old = '#include <android-base/logging.h>\n'
          inc_new = '#include <android-base/logging.h>\n#include <unistd.h>\n'
          if kmtext.count(inc_old) != 1:
              raise SystemExit(f'Keymaster.cpp include anchor count={kmtext.count(inc_old)}')
          kmtext = kmtext.replace(inc_old, inc_new, 1)

          ctor_old = '''Keymaster::Keymaster() {
              ::ndk::SpAIBinder binder(AServiceManager_waitForService(keystore2_service_name));
              auto keystore2Service = ks2::IKeystoreService::fromBinder(binder);
          '''
          ctor_new = '''Keymaster::Keymaster() {
              AIBinder* raw_binder = nullptr;
              for (int attempt = 0; attempt < 50 && raw_binder == nullptr; ++attempt) {
                  raw_binder = AServiceManager_checkService(keystore2_service_name);
                  if (raw_binder == nullptr)
                      usleep(100000);
              }
              if (raw_binder == nullptr) {
                  LOG(ERROR) << "b2q: keystore2 service unavailable after 5 seconds";
                  return;
              }
              ::ndk::SpAIBinder binder(raw_binder);
              auto keystore2Service = ks2::IKeystoreService::fromBinder(binder);
          '''
          if kmtext.count(ctor_old) != 1:
              raise SystemExit(f'Keymaster.cpp ctor anchor count={kmtext.count(ctor_old)}')
          km.write_text(kmtext.replace(ctor_old, ctor_new, 1))

          # test6h: link recovery against Keymaster 4.0 so the GUI action can
          # verify that the HIDL service is actually registered, not merely
          # that the vendor process is alive.
          mk = root / 'Android.mk'
          mktext = mk.read_text()
          mk_old = ('        android.hardware.gatekeeper@1.0 \\\n'
                    '        android.hardware.weaver@1.0 \\\n')
          mk_new = ('        android.hardware.gatekeeper@1.0 \\\n'
                    '        android.hardware.keymaster@4.0 \\\n'
                    '        android.hardware.weaver@1.0 \\\n')
          if mktext.count(mk_old) != 1:
              raise SystemExit(f'Android.mk keymaster link anchor count={mktext.count(mk_old)}')
          mk.write_text(mktext.replace(mk_old, mk_new, 1))

          # test6h: action.cpp is compiled into libguitwrp, so the GUI module
          # itself also needs the Keymaster HIDL dependency for generated headers.
          guibp = root / 'gui/Android.bp'
          bptext = guibp.read_text()
          bp_old = ('        "libselinux",\n'
                    '        "libziparchive"\n'
                    '    ],\n')
          bp_new = ('        "libselinux",\n'
                    '        "libziparchive",\n'
                    '        "android.hardware.keymaster@4.0"\n'
                    '    ],\n')
          if bptext.count(bp_old) != 1:
              raise SystemExit(f'gui/Android.bp shared_libs anchor count={bptext.count(bp_old)}')
          guibp.write_text(bptext.replace(bp_old, bp_new, 1))

          # 1) Keep startup stable: crypto is compiled, but metadata mapping is not
          #    allowed to block Setup_Fstab_Partitions().
          pm = root / 'partitionmanager.cpp'
          text = pm.read_text()
          old = '\t\tDataManager::SetValue(TW_IS_ENCRYPTED, 1);\n\t\tDecrypt_Data();'
          new = ('\t\tDataManager::SetValue(TW_IS_ENCRYPTED, 1);\n'
                 '\t\tLOGINFO("b2q: startup metadata decrypt deferred to manual ActionThread\\n");')
          if text.count(old) != 1:
              raise SystemExit(f'partitionmanager.cpp expected 1 startup decrypt block, got {text.count(old)}')
          pm.write_text(text.replace(old, new, 1))

          # test6j: add dm-default-key/F2FS checkpoints on top of the
          # test6d instrumentation already applied by scripts/prepare-tree.sh.
          text = pm.read_text()

          def pm_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'partitionmanager.cpp {label} anchor count={count}')
              text = text.replace(old, new, 1)

          pm_once(
              '\t\t\tgui_msg("b2q_metadata_start=[b2q] METADATA START");\n',
              '\t\t\tgui_msg("b2q_metadata_map_start=[b2q] METADATA MAP START");\n'
              '\t\t\tLOGINFO("b2q: metadata input actual=\\\'%s\\\' fs=\\\'%s\\\' mount_opts=\\\'%s\\\' keydir=\\\'%s\\\'\\n", '
              'Decrypt_Data->Actual_Block_Device.c_str(), Decrypt_Data->Current_File_System.c_str(), '
              'Decrypt_Data->Mount_Options.c_str(), Decrypt_Data->Key_Directory.c_str());\n'
              '\t\t\tgui_msg("b2q_metadata_start=[b2q] METADATA START");\n',
              'metadata start')

          pm_once(
              '\t\t\t\tLOGINFO("Successfully decrypted metadata encrypted data partition with new block device: \'%s\'\\n", crypto_blkdev.c_str());\n',
              '\t\t\t\tLOGINFO("Successfully decrypted metadata encrypted data partition with new block device: \'%s\'\\n", crypto_blkdev.c_str());\n'
              '\t\t\t\tgui_msg("b2q_dm_default_key_ready=[b2q] DM DEFAULT KEY READY");\n'
              '\t\t\t\tstd::string b2q_dm_diag;\n'
              '\t\t\t\tTWFunc::Exec_Cmd("echo \'--- /dev/block/mapper ---\'; ls -la /dev/block/mapper 2>&1 || true; '
              'echo \'--- dm nodes ---\'; ls -la /dev/block/dm-* 2>&1 || true; '
              'echo \'--- dm sysfs ---\'; for d in /sys/class/block/dm-*; do [ -e \\\"$d\\\" ] || continue; '
              'echo \\\"[$d]\\\"; cat \\\"$d/dm/name\\\" 2>/dev/null || true; cat \\\"$d/dm/uuid\\\" 2>/dev/null || true; done; '
              'echo \'--- crypto blkdev ---\'; getprop ro.crypto.fs_crypto_blkdev; '
              'echo \'--- resolved ---\'; readlink -f \\\"" + crypto_blkdev + "\\\" 2>/dev/null || true; '
              'echo \'--- data mount ---\'; grep \' /data \' /proc/mounts || true", b2q_dm_diag, true);\n'
              '\t\t\t\tLOGINFO("b2q: dm-default-key diagnostics:\\n%s\\n", b2q_dm_diag.c_str());\n',
              'dm ready')

          pm_once(
              '\t\t\t\tgui_msg("b2q_data_mount_start=[b2q] DATA MOUNT START");\n',
              '\t\t\t\tgui_msg("b2q_data_mount_start=[b2q] DATA MOUNT START");\n'
              '\t\t\t\tgui_msg("b2q_f2fs_mount_start=[b2q] F2FS MOUNT START");\n',
              'f2fs start')

          pm_once(
              '\t\t\t\t\tgui_msg("b2q_data_mount_ok=[b2q] DATA MOUNT OK");\n',
              '\t\t\t\t\tgui_msg("b2q_data_mount_ok=[b2q] DATA MOUNT OK");\n'
              '\t\t\t\t\tgui_msg("b2q_f2fs_mount_ok=[b2q] F2FS MOUNT OK");\n',
              'f2fs success')

          pm_once(
              '\t\t\t\t} else {\n\t\t\t\t\tLOGINFO("Failed to mount data after metadata decrypt\\n");\n\t\t\t\t}\n',
              '\t\t\t\t} else {\n'
              '\t\t\t\t\tstd::string b2q_f2fs_diag;\n'
              '\t\t\t\t\tTWFunc::Exec_Cmd("echo \'--- data block ---\'; ls -la \\\"" + Decrypt_Data->Decrypted_Block_Device + "\\\" 2>&1 || true; '
              'echo \'--- mounts ---\'; grep \' /data \' /proc/mounts || true; '
              'echo \'--- f2fs/dm dmesg ---\'; dmesg | grep -Ei \'f2fs|dm-|device-mapper|fscrypt|metadata|userdata\' | tail -n 160", b2q_f2fs_diag, true);\n'
              '\t\t\t\t\tLOGINFO("b2q: F2FS mount failure diagnostics:\\n%s\\n", b2q_f2fs_diag.c_str());\n'
              '\t\t\t\t\tgui_err("b2q_f2fs_mount_fail=[b2q] F2FS MOUNT FAIL");\n'
              '\t\t\t\t\tLOGINFO("Failed to mount data after metadata decrypt\\n");\n'
              '\t\t\t\t}\n',
              'f2fs failure')

          pm_once(
              '\t\t\t} else {\n\t\t\t\tLOGINFO("Unable to decrypt metadata encryption\\n");\n\t\t\t}\n',
              '\t\t\t} else {\n'
              '\t\t\t\tgui_err("b2q_metadata_map_fail=[b2q] METADATA MAP FAIL");\n'
              '\t\t\t\tLOGINFO("Unable to decrypt metadata encryption\\n");\n'
              '\t\t\t}\n',
              'metadata failure')

          pm.write_text(text)

          # 2) Add a dedicated threaded GUI action that prepares metadata/FBE only.
          objects = root / 'gui/objects.hpp'
          text = objects.read_text()
          old = '\tint decrypt(std::string arg);\n'
          new = '\tint preparedecrypt(std::string arg);\n\tint decrypt(std::string arg);\n'
          if text.count(old) != 1:
              raise SystemExit(f'objects.hpp expected 1 decrypt declaration, got {text.count(old)}')
          objects.write_text(text.replace(old, new, 1))

          action = root / 'gui/action.cpp'
          text = action.read_text()
          include_old = '#include <android-base/properties.h>\n'
          include_new = '#include <android-base/properties.h>\n#include <android/hardware/keymaster/4.0/IKeymasterDevice.h>\n'
          if text.count(include_old) != 1:
              raise SystemExit(f'action.cpp keymaster include anchor count={text.count(include_old)}')
          text = text.replace(include_old, include_new, 1)
          old = '\t\tADD_ACTION(decrypt);\n'
          new = '\t\tADD_ACTION(preparedecrypt);\n\t\tADD_ACTION(decrypt);\n'
          if text.count(old) != 1:
              raise SystemExit(f'action.cpp expected 1 decrypt registration, got {text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = 'int GUIAction::decrypt(std::string arg __unused)\n{'
          prepare = '''int GUIAction::preparedecrypt(std::string arg __unused)
          {
          \tint op_status = 1;

          \toperation_start("Prepare Data Decryption");
          \tif (simulate) {
          \t\tsimulate_progress_bar();
          \t\top_status = 0;
          \t} else {
          \t\tLOGINFO("b2q: manual metadata decrypt preparation starting\\n");
          \t\tgui_msg("b2q_vendor_mount_start=[b2q] VENDOR MOUNT START");
          \t\tif (!PartitionManager.Mount_By_Path("/vendor", false)) {
          \t\t\tgui_err("b2q_vendor_mount_fail=[b2q] VENDOR MOUNT FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_vendor_mount_ok=[b2q] VENDOR MOUNT OK");

          \t\tgui_msg("b2q_efs_mount_start=[b2q] EFS MOUNT START");
          \t\tif (!PartitionManager.Mount_By_Path("/efs", false)) {
          \t\t\tgui_err("b2q_efs_mount_fail=[b2q] EFS MOUNT FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tTWFunc::Recursive_Mkdir("/mnt/vendor/efs");
          \t\tif (TWFunc::Exec_Cmd("mount -o bind /efs /mnt/vendor/efs", false) != 0) {
          \t\t\tgui_err("b2q_efs_bind_fail=[b2q] EFS BIND FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_efs_bind_ok=[b2q] EFS BIND OK");

          \t\tgui_print("[b2q] FIRMWARE PROBE START\\n");
          \t\tstd::string fw_diag;
          \t\tint fw_status = TWFunc::Exec_Cmd("/system/bin/sh /system/bin/b2q-firmware-probe.sh", fw_diag, true);
          \t\tLOGINFO("b2q: firmware probe diagnostics:\\n%s\\n", fw_diag.c_str());
          \t\tgui_print("[b2q] FIRMWARE PROBE rc=%d\\n", fw_status);
          \t\tif (fw_status != 0) {
          \t\t\tLOGINFO("b2q: firmware probe exit status: %d; continuing into stock QSEE/Keymaster path\\n", fw_status);
          \t\t\tgui_print("[b2q] FIRMWARE IMAGE MISSING - CONTINUE\\n");
          \t\t} else {
          \t\t\tgui_print("[b2q] FIRMWARE READY\\n");
          \t\t}
          \t\tif (!TWFunc::Path_Exists("/vendor/bin/qseecomd")) {
          \t\t\tgui_print_color("error", "[b2q] STOCK QSEECOMD BINARY MISSING\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tif (!TWFunc::Path_Exists("/vendor/bin/hw/android.hardware.keymaster@4.0-service")) {
          \t\t\tgui_print_color("error", "[b2q] STOCK KEYMASTER BINARY MISSING\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] STOCK QSEE + KEYMASTER BINARIES OK\\n");

          \t\tgui_msg("b2q_dak_start=[b2q] DAK PREP START");
          \t\tif (TWFunc::Exec_Cmd("mkdir -p /mnt/vendor/efs/DAK && chown 1000:1000 /mnt/vendor/efs/DAK && chmod 0775 /mnt/vendor/efs/DAK && if [ -e /mnt/vendor/efs/DAK/gakkeybox ]; then chown 1000:1000 /mnt/vendor/efs/DAK/gakkeybox; chmod 0644 /mnt/vendor/efs/DAK/gakkeybox; fi && restorecon -R /mnt/vendor/efs/DAK >/dev/null 2>&1 || true", false) != 0) {
          \t\t\tgui_err("b2q_dak_fail=[b2q] DAK PREP FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_dak_ok=[b2q] DAK PREP OK");

          \t\tgui_msg("b2q_qsee_dev_start=[b2q] QSEE DEVICE WAIT");
          \t\tfor (int i = 0; i < 50 && !TWFunc::Path_Exists("/dev/qseecom"); ++i)
          \t\t\tusleep(100000);
          \t\tif (!TWFunc::Path_Exists("/dev/qseecom")) {
          \t\t\tgui_err("b2q_qsee_dev_fail=[b2q] QSEE DEVICE FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_qsee_start=[b2q] QSEECOMD START");
          \t\tandroid::base::SetProperty("ctl.start", "vendor.qseecomd");
          \t\tint qsee_stable = 0;
          \t\tfor (int i = 0; i < 100 && qsee_stable < 20; ++i) {
          \t\t\tif (android::base::GetProperty("init.svc.vendor.qseecomd", "") == "running")
          \t\t\t\t++qsee_stable;
          \t\t\telse
          \t\t\t\tqsee_stable = 0;
          \t\t\tusleep(100000);
          \t\t}
          \t\tif (qsee_stable < 20) {
          \t\t\tstd::string sec_diag;
          \t\t\tTWFunc::Exec_Cmd("/system/bin/sh /system/bin/b2q-security-diag.sh", sec_diag, true);
          \t\t\tLOGINFO("b2q: QSEE unstable diagnostics:\\n%s\\n", sec_diag.c_str());
          \t\t\tgui_print_color("error", "[b2q] QSEECOMD UNSTABLE\\n");
          \t\t\tgui_print("%s\\n", sec_diag.c_str());
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] QSEECOMD STABLE\\n");

          \t\tgui_print("[b2q] SPU PREP START\\n");
          \t\tTWFunc::Recursive_Mkdir("/mnt/vendor/persist");
          \t\tTWFunc::Recursive_Mkdir("/spu");

          \t\t// test6r: mount Samsung SM8350 persist at its stock path directly.
          \t\t// Do not route this through TWRP's /persist partition object.
          \t\tif (!TWFunc::Path_Exists("/dev/block/bootdevice/by-name/persist")) {
          \t\t\tgui_print_color("error", "[b2q] PERSIST BLOCK MISSING\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tif (TWFunc::Exec_Cmd("mountpoint -q /mnt/vendor/persist || mount -t ext4 -o rw,noatime,nosuid,nodev /dev/block/bootdevice/by-name/persist /mnt/vendor/persist", false) != 0) {
          \t\t\tstd::string persist_diag;
          \t\t\tTWFunc::Exec_Cmd("echo '--- persist block ---'; ls -l /dev/block/bootdevice/by-name/persist; blkid /dev/block/bootdevice/by-name/persist 2>&1 || true; echo '--- mounts ---'; grep -E 'persist|spu' /proc/mounts || true; echo '--- ext4 dmesg ---'; dmesg | grep -Ei 'persist|EXT4|I/O error|dm-|ufs' | tail -n 100", persist_diag, true);
          \t\t\tLOGINFO("b2q: direct persist mount diagnostics:\\n%s\\n", persist_diag.c_str());
          \t\t\tgui_print_color("error", "[b2q] PERSIST DIRECT MOUNT FAIL\\n");
          \t\t\tgui_print("%s\\n", persist_diag.c_str());
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tif (TWFunc::Exec_Cmd("grep ' /mnt/vendor/persist ' /proc/mounts | grep -q ' rw,'", false) != 0) {
          \t\t\tgui_print_color("error", "[b2q] PERSIST DIRECT NOT RW - STOP\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] PERSIST DIRECT RW READY\\n");

          \t\t// Stock b2q/SM8350 also mounts the dedicated SPU firmware partition.
          \t\tif (!TWFunc::Path_Exists("/dev/block/bootdevice/by-name/spu")) {
          \t\t\tgui_print_color("error", "[b2q] SPU BLOCK MISSING\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tif (TWFunc::Exec_Cmd("mountpoint -q /spu || mount -t ext4 -o ro,noatime,nosuid,nodev /dev/block/bootdevice/by-name/spu /spu", false) != 0) {
          \t\t\tstd::string spu_mount_diag;
          \t\t\tTWFunc::Exec_Cmd("echo '--- spu block ---'; ls -l /dev/block/bootdevice/by-name/spu; blkid /dev/block/bootdevice/by-name/spu 2>&1 || true; echo '--- mounts ---'; grep -E 'persist|spu' /proc/mounts || true; echo '--- spu dir ---'; ls -la /spu 2>&1 | head -n 80; dmesg | grep -Ei 'spu|spss|EXT4|I/O error' | tail -n 100", spu_mount_diag, true);
          \t\t\tLOGINFO("b2q: SPU firmware mount diagnostics:\\n%s\\n", spu_mount_diag.c_str());
          \t\t\tgui_print_color("error", "[b2q] SPU FIRMWARE MOUNT FAIL\\n");
          \t\t\tgui_print("%s\\n", spu_mount_diag.c_str());
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SPU FIRMWARE READY\\n");

          \t\t// Mirror Samsung init.spdaemon.rc state directories.
          \t\tif (TWFunc::Exec_Cmd("mkdir -p /mnt/vendor/persist/iar_db /mnt/vendor/persist/secnvm && chown 1000:1000 /mnt/vendor/persist/iar_db /mnt/vendor/persist/secnvm && chmod 0770 /mnt/vendor/persist/iar_db /mnt/vendor/persist/secnvm", false) != 0) {
          \t\t\tgui_print_color("error", "[b2q] SPU DIR PREP FAIL\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tTWFunc::Exec_Cmd("restorecon -R /mnt/vendor/persist/iar_db /mnt/vendor/persist/secnvm >/dev/null 2>&1 || true", false);
          \t\tif (!TWFunc::Path_Exists("/mnt/vendor/persist/iar_db") || !TWFunc::Path_Exists("/mnt/vendor/persist/secnvm")) {
          \t\t\tgui_print_color("error", "[b2q] SPU DIR VERIFY FAIL\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SPU DIRS DIRECT READY\\n");

          \t\tstd::string spu_nodes_diag;
          \t\tTWFunc::Exec_Cmd("for n in /dev/spcom /dev/spss_utils /dev/sp_kernel /dev/sp_nvm /dev/sp_ssr /dev/sp_keymaster /dev/sp_keymaster_ssr /dev/sec_nvm_* /dev/cryptoapp /dev/spdaemon_ssr /dev/spu_hal_ssr; do [ -e \\\"$n\\\" ] || continue; chown system:system \\\"$n\\\" 2>/dev/null || true; chmod 0660 \\\"$n\\\" 2>/dev/null || true; done; /system/bin/sh /system/bin/b2q-security-diag.sh", spu_nodes_diag, true);
          \t\tLOGINFO("b2q: pre-SPU diagnostics:\\n%s\\n", spu_nodes_diag.c_str());

          \t\tif (!TWFunc::Path_Exists("/vendor/bin/spdaemon") || !TWFunc::Path_Exists("/vendor/bin/sec_nvm")) {
          \t\t\tgui_print_color("error", "[b2q] SPU BINARIES MISSING\\n");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}

          \t\tgui_print("[b2q] SPDAEMON + SEC_NVM STOCK START\\n");
          \t\t// Stock Samsung SM8350 init.spdaemon.rc starts both services
          \t\t// back-to-back. Do not let spdaemon run alone before sec_nvm.
          \t\tandroid::base::SetProperty("ctl.start", "vendor.spdaemon");
          \t\tandroid::base::SetProperty("ctl.start", "vendor.sec_nvm");
          \t\tusleep(100000);
          \t\tgui_print("[b2q] SPDAEMON STATE=%s\\n", android::base::GetProperty("init.svc.vendor.spdaemon", "").c_str());
          \t\tgui_print("[b2q] SEC_NVM STATE=%s\\n", android::base::GetProperty("init.svc.vendor.sec_nvm", "").c_str());

          \t\tint spu_stable = 0;
          \t\tfor (int i = 0; i < 150 && spu_stable < 20; ++i) {
          \t\t\tconst bool services_ok =
          \t\t\t\tandroid::base::GetProperty("init.svc.vendor.spdaemon", "") == "running" &&
          \t\t\t\tandroid::base::GetProperty("init.svc.vendor.sec_nvm", "") == "running";
          \t\t\tconst bool channels_ok =
          \t\t\t\tTWFunc::Path_Exists("/dev/sp_nvm") && TWFunc::Path_Exists("/dev/sp_keymaster");
          \t\t\tif (services_ok && channels_ok)
          \t\t\t\t++spu_stable;
          \t\t\telse
          \t\t\t\tspu_stable = 0;
          \t\t\tusleep(100000);
          \t\t}
          \t\tif (spu_stable < 20) {
          \t\t\tstd::string sec_diag;
          \t\t\tTWFunc::Exec_Cmd("/system/bin/sh /system/bin/b2q-security-diag.sh", sec_diag, true);
          \t\t\tLOGINFO("b2q: SPU unstable diagnostics:\\n%s\\n", sec_diag.c_str());
          \t\t\tgui_print_color("error", "[b2q] SPU STACK UNSTABLE\\n");
          \t\t\tgui_print("%s\\n", sec_diag.c_str());
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_print("[b2q] SPU STACK STABLE\\n");

          \t\tgui_msg("b2q_keymaster_dir_start=[b2q] KEYMASTER DIR START");
          \t\tif (!TWFunc::Recursive_Mkdir("/data/vendor/keymaster")) {
          \t\t\tgui_err("b2q_keymaster_dir_fail=[b2q] KEYMASTER DIR FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tchmod("/data/vendor", 0775);
          \t\tchmod("/data/vendor/keymaster", 0775);
          \t\tif (TWFunc::Exec_Cmd("chown 1000:1000 /data/vendor /data/vendor/keymaster", false) != 0) {
          \t\t\tgui_err("b2q_keymaster_owner_fail=[b2q] KEYMASTER OWNER FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_keymaster_dir_ok=[b2q] KEYMASTER DIR OK");

          \t\tgui_msg("b2q_keymaster_start=[b2q] KEYMASTER START");
          \t\tandroid::base::SetProperty("ctl.start", "vendor.keymaster-4-0");
          \t\tgui_print("[b2q] KEYMASTER HAL WAIT\\n");
          \t\tandroid::sp<android::hardware::keymaster::V4_0::IKeymasterDevice> keymaster_hal;
          \t\tfor (int i = 0; i < 200 && keymaster_hal == nullptr; ++i) {
          \t\t\tconst std::string km_state = android::base::GetProperty("init.svc.vendor.keymaster-4-0", "");
          \t\t\tif (km_state == "running")
          \t\t\t\tkeymaster_hal = android::hardware::keymaster::V4_0::IKeymasterDevice::tryGetService("default", false);
          \t\t\telse if (km_state == "stopped" && i > 5)
          \t\t\t\tbreak;
          \t\t\tusleep(100000);
          \t\t}
          \t\tif (keymaster_hal == nullptr) {
          \t\t\tstd::string km_diag;
          \t\t\tTWFunc::Exec_Cmd("/system/bin/sh /system/bin/b2q-security-diag.sh", km_diag, true);
          \t\t\tLOGINFO("b2q: keymaster HAL diagnostics:\\n%s\\n", km_diag.c_str());
          \t\t\tgui_print_color("error", "[b2q] KEYMASTER HAL FAIL\\n");
          \t\t\tgui_print("%s\\n", km_diag.c_str());
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_keymaster_hal_ok=[b2q] KEYMASTER HAL READY");

          \t\tgui_msg("b2q_keystore_start=[b2q] KEYSTORE2 RESTART");
          \t\tandroid::base::SetProperty("ctl.stop", "keystore2");
          \t\tusleep(300000);
          \t\tandroid::base::SetProperty("ctl.start", "keystore2");
          \t\tfor (int i = 0; i < 50 && android::base::GetProperty("init.svc.keystore2", "") != "running"; ++i)
          \t\t\tusleep(100000);
          \t\tif (android::base::GetProperty("init.svc.keystore2", "") != "running") {
          \t\t\tgui_err("b2q_keystore_fail=[b2q] KEYSTORE2 FAIL");
          \t\t\toperation_end(1);
          \t\t\treturn 0;
          \t\t}
          \t\tgui_msg("b2q_keystore_ok=[b2q] KEYSTORE2 RUNNING");
          \t\tusleep(500000);

          \t\tPartitionManager.Decrypt_Data();
          \t\tTWPartition* data = PartitionManager.Find_Partition_By_Path("/data");
          \t\tif (data && data->Is_Decrypted) {
          \t\t\tLOGINFO("b2q: metadata mapping is ready, block device: '%s'\\n", data->Decrypted_Block_Device.c_str());
          \t\t\tif (data->Is_Mounted()) {
          \t\t\t\tgui_msg("b2q_data_mount_confirmed=[b2q] DATA MOUNT CONFIRMED");
          \t\t\t\top_status = 0;
          \t\t\t} else {
          \t\t\t\tgui_err("b2q_data_still_unmounted=[b2q] DATA STILL UNMOUNTED");
          \t\t\t}
          \t\t} else {
          \t\t\tLOGERR("b2q: metadata mapping was not prepared\\n");
          \t\t}
          \t\tPartitionManager.Update_System_Details();
          \t}

          \toperation_end(op_status);
          \treturn 0;
          }

          int GUIAction::decrypt(std::string arg __unused)
          {'''
          if text.count(anchor) != 1:
              raise SystemExit(f'action.cpp expected 1 decrypt function anchor, got {text.count(anchor)}')
          text = text.replace(anchor, prepare, 1)

          # Keep test5 fallback: when the user later submits PIN/password, ensure
          # metadata mapping exists first. This remains on TWRP's ActionThread.
          old = '} else {\n\t\tstring Password;'
          new = ('} else {\n'
                 '\t\tLOGINFO("b2q: GUI decrypt action checking metadata mapping\\n");\n'
                 '\t\tPartitionManager.Decrypt_Data();\n\n'
                 '\t\tstring Password;')
          if text.count(old) != 1:
              raise SystemExit(f'action.cpp expected 1 decrypt action block, got {text.count(old)}')
          action.write_text(text.replace(old, new, 1))

          # 3) On Mount, reuse the left row18a slot while data is encrypted.
          #    The stock right-hand "Decrypt Data" button remains untouched.
          #    This avoids the test6b overlap seen on-device between row18a/row21a.
          portrait = root / 'gui/theme/common/portrait.xml'
          text = portrait.read_text()

          usb = '''\t\t\t<button style="main_button_half_height">\n\t\t\t\t<condition var1="tw_has_usb_storage" var2="1"/>\n\t\t\t\t<placement x="%indent%" y="%row18a_y%"/>\n\t\t\t\t<text>{@mount_usb_storage_btn=Mount USB Storage}</text>\n\t\t\t\t<action function="page">usb_mount</action>\n\t\t\t</button>'''
          usb_new = '''\t\t\t<button style="main_button_half_height">\n\t\t\t\t<conditions>\n\t\t\t\t\t<condition var1="tw_has_usb_storage" var2="1"/>\n\t\t\t\t\t<condition var1="tw_is_encrypted" var2="0"/>\n\t\t\t\t</conditions>\n\t\t\t\t<placement x="%indent%" y="%row18a_y%"/>\n\t\t\t\t<text>{@mount_usb_storage_btn=Mount USB Storage}</text>\n\t\t\t\t<action function="page">usb_mount</action>\n\t\t\t</button>'''
          if text.count(usb) != 1:
              raise SystemExit(f'portrait.xml expected exactly 1 Mount USB Storage button, got {text.count(usb)}')
          text = text.replace(usb, usb_new, 1)

          mount_selector = '''\t\t\t<button style="main_button_half_height">\n\t\t\t\t<placement x="%indent%" y="%row21a_y%"/>\n\t\t\t\t<text>{@select_storage_btn=Select Storage}</text>\n\t\t\t\t<actions>\n\t\t\t\t\t<action function="set">tw_back=mount</action>\n\t\t\t\t\t<action function="overlay">select_storage</action>\n\t\t\t\t</actions>\n\t\t\t</button>'''
          button = '''\t\t\t<button style="main_button_half_height">\n\t\t\t\t<conditions>\n\t\t\t\t\t<condition var1="tw_is_encrypted" var2="1"/>\n\t\t\t\t\t<condition var1="tw_is_decrypted" var2="0"/>\n\t\t\t\t</conditions>\n\t\t\t\t<placement x="%indent%" y="%row18a_y%"/>\n\t\t\t\t<text>Prepare Data</text>\n\t\t\t\t<actions>\n\t\t\t\t\t<action function="set">tw_back=mount</action>\n\t\t\t\t\t<action function="set">tw_action=preparedecrypt</action>\n\t\t\t\t\t<action function="set">tw_action_param=</action>\n\t\t\t\t\t<action function="set">tw_has_action2=0</action>\n\t\t\t\t\t<action function="set">tw_action_text1=Prepare Data Decryption</action>\n\t\t\t\t\t<action function="set">tw_action_text2=Preparing metadata mapping...</action>\n\t\t\t\t\t<action function="set">tw_complete_text1=Metadata Mapping</action>\n\t\t\t\t\t<action function="page">action_page</action>\n\t\t\t\t</actions>\n\t\t\t</button>\n\n'''
          if text.count(mount_selector) != 1:
              raise SystemExit(f'portrait.xml expected exactly 1 Mount storage selector, got {text.count(mount_selector)}')
          portrait.write_text(text.replace(mount_selector, button + mount_selector, 1))

          # test6l: custom b2q checkpoints are literal console messages, not
          # translation resource keys. This removes the noisy
          # "String resource ... not found" lines seen on-device.
          for cpp in (pm, action):
              t = cpp.read_text()
              t = re.sub(
                  r'gui_msg\("b2q_[^"]*=\[b2q\] ([^"]*)"\);',
                  lambda m: 'gui_print("[b2q] ' + m.group(1) + '\\\\n");',
                  t,
              )
              t = re.sub(
                  r'gui_err\("b2q_[^"]*=\[b2q\] ([^"]*)"\);',
                  lambda m: 'gui_print_color("error", "[b2q] ' + m.group(1) + '\\\\n");',
                  t,
              )
              t = t.replace('\\\\n");', '\\n");')
              cpp.write_text(t)
          PY

          cd "$RECOVERY"
          grep -Fq 'b2q: startup metadata decrypt deferred to manual ActionThread' partitionmanager.cpp
          grep -Fq 'ADD_ACTION(preparedecrypt);' gui/action.cpp
          grep -Fq 'GUIAction::preparedecrypt' gui/action.cpp
          grep -Fq 'VENDOR MOUNT START' gui/action.cpp
          grep -Fq 'SPU PREP START' gui/action.cpp
          grep -Fq 'PERSIST DIRECT RW READY' gui/action.cpp
          grep -Fq 'PERSIST DIRECT MOUNT FAIL' gui/action.cpp
          grep -Fq 'SPU FIRMWARE READY' gui/action.cpp
          grep -Fq 'SPU FIRMWARE MOUNT FAIL' gui/action.cpp
          grep -Fq 'SPU DIRS DIRECT READY' gui/action.cpp
          grep -Fq '/dev/block/bootdevice/by-name/persist' gui/action.cpp
          grep -Fq '/dev/block/bootdevice/by-name/spu' gui/action.cpp
          grep -Fq '/mnt/vendor/persist/iar_db' gui/action.cpp
          grep -Fq '/mnt/vendor/persist/secnvm' gui/action.cpp
          ! grep -Fq 'PERSIST RO READY' gui/action.cpp
          grep -Fq '/persist' "$DEVICE/recovery/root/system/etc/twrp.flags"
          ! grep -Fq 'fsflags=ro;display="Persist"' "$DEVICE/recovery/root/system/etc/twrp.flags"
          grep -Fq 'SPDAEMON + SEC_NVM STOCK START' gui/action.cpp
          ! grep -Fq 'usleep(700000);' gui/action.cpp
          grep -Fq 'SPDAEMON STATE=' gui/action.cpp
          ! grep -Fq 'gui_print("[b2q] SEC_NVM START' gui/action.cpp
          grep -Fq 'SEC_NVM STATE=' gui/action.cpp
          grep -Fq 'init.svc.vendor.spdaemon' gui/action.cpp
          grep -Fq 'init.svc.vendor.sec_nvm' gui/action.cpp
          grep -Fq 'SPU STACK STABLE' gui/action.cpp
          grep -Fq 'SPU STACK UNSTABLE' gui/action.cpp
          grep -Fq 'QSEECOMD STABLE' gui/action.cpp
          grep -Fq 'QSEECOMD UNSTABLE' gui/action.cpp
          grep -Fq 'KEYMASTER HAL WAIT' gui/action.cpp
          grep -Fq 'QSEECOMD STABLE' gui/action.cpp
          grep -Fq 'b2q-security-diag.sh' gui/action.cpp
          grep -Fq 'keymaster HAL diagnostics' gui/action.cpp
          test -f "$DEVICE/recovery/root/system/bin/b2q-firmware-probe.sh"
          bash -n "$DEVICE/recovery/root/system/bin/b2q-firmware-probe.sh"
          grep -Fq 'FIRMWARE PROBE START' gui/action.cpp
          grep -Fq 'FIRMWARE IMAGE MISSING - CONTINUE' gui/action.cpp
          grep -Fq 'STOCK QSEE + KEYMASTER BINARIES OK' gui/action.cpp
          grep -Fq 'firmware probe diagnostics' gui/action.cpp
          ! grep -Fq 'b2q_firmware_probe_fail=' gui/action.cpp
          ! grep -Fq 'String resource' gui/action.cpp
          grep -Fq 'gui_print("[b2q] VENDOR MOUNT START' gui/action.cpp
          grep -Fq 'gui_print("[b2q] METADATA MAP START' partitionmanager.cpp
          grep -Fq 'DAK PREP OK' gui/action.cpp
          grep -Fq 'chown 1000:1000 /data/vendor /data/vendor/keymaster' gui/action.cpp
          grep -Fq 'KEYMASTER HAL READY' gui/action.cpp
          grep -Fq '#include <android/hardware/keymaster/4.0/IKeymasterDevice.h>' gui/action.cpp
          grep -Fq 'android.hardware.keymaster@4.0' Android.mk
          grep -Fq 'android.hardware.keymaster@4.0' gui/Android.bp
          grep -Fq 'KEYMASTER DIR OK' gui/action.cpp
          grep -Fq 'KEYSTORE2 RUNNING' gui/action.cpp
          grep -Fq 'AServiceManager_checkService' "$VOLD/Keymaster.cpp"
          ! grep -Fq 'AServiceManager_waitForService(keystore2_service_name)' "$VOLD/Keymaster.cpp"
          grep -Fq 'metadata mapping is ready' gui/action.cpp
          grep -Fq 'DATA MOUNT CONFIRMED' gui/action.cpp
          grep -Fq 'METADATA MAP START' partitionmanager.cpp
          grep -Fq 'DM DEFAULT KEY READY' partitionmanager.cpp
          grep -Fq 'F2FS MOUNT START' partitionmanager.cpp
          grep -Fq 'F2FS MOUNT FAIL' partitionmanager.cpp
          grep -Fq 'dm-default-key diagnostics' partitionmanager.cpp
          grep -Fq 'F2FS mount failure diagnostics' partitionmanager.cpp
          grep -Fq 'int preparedecrypt(std::string arg);' gui/objects.hpp
          grep -Fq '<text>Prepare Data</text>' gui/theme/common/portrait.xml
          grep -Fq '<action function="set">tw_action=preparedecrypt</action>' gui/theme/common/portrait.xml
          grep -Fq '<condition var1="tw_is_encrypted" var2="0"/>' gui/theme/common/portrait.xml
          grep -Fq '<action function="set">tw_back=mount</action>' gui/theme/common/portrait.xml
          xmllint --noout gui/theme/common/portrait.xml
          ! grep -Fq '#include <thread>' partitionmanager.cpp
          ! grep -Fq 'std::thread' partitionmanager.cpp
          if grep -A4 -F 'DataManager::SetValue(TW_IS_ENCRYPTED, 1);' partitionmanager.cpp | grep -Fq $'\t\tDecrypt_Data();'; then
            echo 'Synchronous startup Decrypt_Data() is still active' >&2
            exit 1
          fi
          echo '[b2q] test6t stock SPU startup order verified'

      - name: Build recovery.img
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          source build/envsetup.sh
          lunch twrp_b2q-eng
          mka -j"$(nproc)" recoveryimage

      - name: Verify recovery image
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/twrp/out/target/product/b2q"
          test -s "$OUT/recovery.img"
          test -s "$OUT/recovery/root/system/lib64/libion.so"
          file "$OUT/recovery/root/system/lib64/libion.so"
          readelf -d "$OUT/recovery/root/system/lib64/libion.so" | head -n 80
          echo '[b2q] libion.so present in recovery/root/system/lib64'
          stat "$OUT/recovery.img"
          sha256sum "$OUT/recovery.img" | tee "$OUT/recovery.img.sha256"
          if [ "$(stat -c %s "$OUT/recovery.img")" -gt 100663296 ]; then
            echo 'recovery.img exceeds the 96 MiB recovery partition' >&2
            exit 1
          fi

      - name: Build Odin test6t package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/twrp/out/target/product/b2q"
          cd "$OUT"
          BASE="TWRP-b2q-test6t-${GITHUB_SHA::8}"
          tar --format=ustar -cf "$BASE-Odin.tar" recovery.img
          cp "$BASE-Odin.tar" "$BASE-Odin.tar.md5"
          md5sum -t "$BASE-Odin.tar.md5" >> "$BASE-Odin.tar.md5"
          sha256sum recovery.img "$BASE-Odin.tar" "$BASE-Odin.tar.md5" > SHA256SUMS.txt
          tar -tf "$BASE-Odin.tar"

      - name: Upload test6t artifact
